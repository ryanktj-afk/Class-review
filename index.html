 time at the concert?", "alts": [["have"]], "hint": "경험", "ko": "콘서트 재밌었어요?"}, {"text": "___ a cookie. They're really good.", "alts": [["Have"]], "hint": "권하기", "ko": "쿠키 드세요. 정말 맛있어요."}, {"text": "I ___ a meeting at 3 today.", "alts": [["have"], ["'ve got"]], "hint": "일정", "ko": "오늘 3시에 회의가 있어요."}, {"text": "Can I ___ a look at your photos?", "alts": [["have"], ["take"]], "hint": "have a look", "ko": "사진 좀 봐도 돼요?"}, {"text": "My sister just ___ a baby!", "alts": [["had"]], "hint": "have a baby", "ko": "제 언니가 막 아기를 낳았어요!"}, {"text": "Do you ___ a cold? You sound sick.", "alts": [["have"]], "hint": "아픔", "ko": "감기 걸렸어요? 목소리가 아파 보여요."}, {"text": "We ___ a lot of fun at the beach yesterday.", "alts": [["had"]], "hint": "have fun", "ko": "어제 해변에서 정말 재밌게 놀았어요."}, {"text": "I ___ a shower and went to bed.", "alts": [["had"], ["took"]], "hint": "have a shower", "ko": "샤워하고 잤어요."}], "production": [{"ko": "저는 언니가 둘 있어요.", "en": "I have two sisters."}, {"ko": "감기 걸렸어요.", "en": "I have a cold."}, {"ko": "오늘 아침에 아침 먹었어요?", "en": "Did you have breakfast this morning?"}, {"ko": "그는 지금 점심 먹고 있어요.", "en": "He's having lunch right now."}, {"ko": "즐거운 시간 보내세요!", "en": "Have a good time!"}, {"ko": "다음 주 토요일에 파티해요.", "en": "We're having a party next Saturday."}, {"ko": "어렸을 때 강아지를 키웠어요.", "en": "I had a dog when I was a kid."}, {"ko": "오늘 오후에 회의 있어요.", "en": "I have a meeting this afternoon."}, {"ko": "머리가 너무 아파요.", "en": "I have a bad headache."}, {"ko": "어제 해변에서 정말 재미있었어요.", "en": "We had a lot of fun at the beach yesterday."}, {"ko": "잠깐 봐도 돼요?", "en": "Can I have a look?"}, {"ko": "시간 좀 있어요?", "en": "Do you have a minute?"}]}, {"n": 57, "title": "I/me, he/him, they/them, etc.", "chapter": "인칭대명사", "points": ["주어: I, we, you, he, she, it, they / 목적어: me, us, you, him, her, it, them. Tom knows me. / I know him. 사물도: I like it. / I like them.", "전치사(for/to/with/at/on) 뒤에는 목적격: It's for me. / Come with us. / Why are you looking at her? give it to me / give them to him."], "fill": [{"text": "I know Tom, and Tom knows ___.", "alts": [["me"]], "hint": "목적격", "ko": "저는 톰을 알고 톰도 저를 알아요."}, {"text": "I don't want this book. You can have ___.", "alts": [["it"]], "hint": "사물, 단수", "ko": "이 책 필요 없어요. 가져도 돼요."}, {"text": "I don't want these books. You can have ___.", "alts": [["them"]], "hint": "사물, 복수", "ko": "이 책들 필요 없어요. 가져도 돼요."}, {"text": "Hannah never drinks milk. She doesn't like ___.", "alts": [["it"]], "hint": "사물", "ko": "한나는 우유를 절대 안 마셔요. 안 좋아해요."}, {"text": "This letter isn't for me. It's for ___.", "alts": [["you"]], "hint": "전치사 뒤", "ko": "이 편지는 제 거 아니에요. 당신 거예요."}, {"text": "Who is that woman? Why are you looking at ___?", "alts": [["her"]], "hint": "전치사 뒤", "ko": "저 여자 누구예요? 왜 쳐다봐요?"}, {"text": "We're going to the movies. Do you want to come with ___?", "alts": [["us"]], "hint": "전치사 뒤", "ko": "우리 영화 보러 가요. 같이 갈래요?"}, {"text": "Sue and Kevin are going out. Do you want to go with ___?", "alts": [["them"]], "hint": "전치사 뒤", "ko": "수랑 케빈이 나가요. 같이 갈래요?"}, {"text": "\"Where's the newspaper?\" \"You're sitting on ___.\"", "alts": [["it"]], "hint": "전치사 뒤", "ko": "\"신문 어디 있어요?\" \"깔고 앉아 있잖아요.\""}, {"text": "I want that book. Please give it to ___.", "alts": [["me"]], "hint": "give it to", "ko": "그 책 갖고 싶어요. 저한테 주세요."}, {"text": "Robert needs these books. Can you give ___ to ___?", "alts": [["them", "him"]], "hint": "give them to", "ko": "로버트가 이 책들이 필요해요. 갖다줄래요?"}, {"text": "I never go to parties. I don't like ___.", "alts": [["them"]], "hint": "사물, 복수", "ko": "저는 파티에 절대 안 가요. 안 좋아해요."}, {"text": "My brother lives in Busan. I call ___ every week.", "alts": [["him"]], "hint": "목적격", "ko": "남동생이 부산에 살아요. 매주 전화해요."}, {"text": "___ is a great teacher. Everybody likes ___. (Ms. Kim)", "alts": [["She", "her"]], "hint": "주격, 목적격", "ko": "그녀는 정말 좋은 선생님이에요. 다들 좋아해요."}], "production": [{"ko": "그녀를 잘 알아요.", "en": "I know her well."}, {"ko": "이 선물 당신 거예요.", "en": "This gift is for you."}, {"ko": "우리랑 같이 갈래요?", "en": "Do you want to come with us?"}, {"ko": "그 책 저한테 주세요.", "en": "Please give that book to me."}, {"ko": "그들한테 전화해 봤어요?", "en": "Did you call them?"}, {"ko": "저는 커피를 좋아하지만 그는 안 좋아해요.", "en": "I like coffee, but he doesn't like it."}, {"ko": "그 사람 이름이 기억 안 나요. 그를 어디서 만났죠?", "en": "I can't remember his name. Where did I meet him?"}, {"ko": "이 신발 마음에 들어요. 살게요.", "en": "I like these shoes. I'll take them."}]}, {"n": 58, "title": "my/his/their, etc.", "chapter": "소유격", "points": ["명사 앞에 소유격: my, our, your, his, her, their, its (my hands, his new car, their room).", "his = 남자 것, her = 여자 것 (Amy's husband = her husband). its(그것의)와 it's(= it is)를 구분해요: Hawaii is famous for its beaches. / It's a beautiful place."], "fill": [{"text": "I like ___ house. (we)", "alts": [["our"]], "hint": "소유격", "ko": "저는 우리 집이 좋아요."}, {"text": "Amy's car → ___ car", "alts": [["her"]], "hint": "여자", "ko": "에이미의 차 → 그녀의 차"}, {"text": "Andy's bike → ___ bike", "alts": [["his"]], "hint": "남자", "ko": "앤디의 자전거 → 그의 자전거"}, {"text": "Mr. and Mrs. Lee's son → ___ son", "alts": [["their"]], "hint": "복수", "ko": "이 씨 부부의 아들 → 그들의 아들"}, {"text": "Hawaii is famous for ___ beaches.", "alts": [["its"]], "hint": "its", "ko": "하와이는 해변으로 유명해요."}, {"text": "I like Hawaii. ___ a beautiful place.", "alts": [["It's"], ["It is"]], "hint": "it's", "ko": "저는 하와이가 좋아요. 아름다운 곳이에요."}, {"text": "Kate lives with ___ parents.", "alts": [["her"]], "hint": "여자", "ko": "케이트는 부모님이랑 살아요."}, {"text": "Daniel and ___ wife have two kids.", "alts": [["his"]], "hint": "남자", "ko": "대니얼 부부는 아이가 둘이에요."}, {"text": "The kids are in ___ room.", "alts": [["their"]], "hint": "복수", "ko": "아이들은 자기 방에 있어요."}, {"text": "Do you know ___ phone number? (you)", "alts": [["your"]], "hint": "소유격", "ko": "당신 전화번호 알아요?"}, {"text": "I'm going to wash ___ hair.", "alts": [["my"]], "hint": "소유격", "ko": "머리 감을 거예요."}, {"text": "The company changed ___ name last year.", "alts": [["its"]], "hint": "its", "ko": "그 회사는 작년에 이름을 바꿨어요."}, {"text": "Tom and Sue sold ___ house.", "alts": [["their"]], "hint": "복수", "ko": "톰과 수는 집을 팔았어요."}, {"text": "Jenny broke ___ leg.", "alts": [["her"]], "hint": "여자", "ko": "제니가 다리가 부러졌어요."}], "production": [{"ko": "제 남편은 요리를 잘해요.", "en": "My husband is a good cook."}, {"ko": "그의 아내는 의사예요.", "en": "His wife is a doctor."}, {"ko": "그녀의 아이들은 아주 귀여워요.", "en": "Her kids are so cute."}, {"ko": "그들의 집은 정말 커요.", "en": "Their house is really big."}, {"ko": "우리 선생님은 친절해요.", "en": "Our teacher is very kind."}, {"ko": "이 도시는 음식으로 유명해요.", "en": "This city is famous for its food."}, {"ko": "이름이 뭐예요?", "en": "What's your name?"}, {"ko": "그는 자기 차를 팔았어요.", "en": "He sold his car."}]}, {"n": 59, "title": "Whose is this? It's mine/yours/hers, etc.", "chapter": "소유대명사", "points": ["명사 없이 쓸 때 mine, ours, yours, his, hers, theirs: Is this book mine or yours? / Emily gave me hers. / It's their problem, not ours.", "a friend of mine / a friend of his / friends of yours (a friend of me X). Whose ...? = 누구 거예요? Whose phone is this? / Whose is this?"], "fill": [{"text": "It's my money. It's ___.", "alts": [["mine"]], "hint": "소유대명사", "ko": "제 돈이에요. 제 거예요."}, {"text": "It's our car. It's ___.", "alts": [["ours"]], "hint": "소유대명사", "ko": "우리 차예요. 우리 거예요."}, {"text": "It's her bag. It's ___.", "alts": [["hers"]], "hint": "소유대명사", "ko": "그녀의 가방이에요. 그녀 거예요."}, {"text": "It's their house. It's ___.", "alts": [["theirs"]], "hint": "소유대명사", "ko": "그들의 집이에요. 그들 거예요."}, {"text": "Is this book mine or ___?", "alts": [["yours"]], "hint": "소유대명사", "ko": "이 책 제 거예요, 당신 거예요?"}, {"text": "I didn't have an umbrella, so Emily gave me ___.", "alts": [["hers"]], "hint": "명사 없이", "ko": "우산이 없어서 에밀리가 자기 걸 줬어요."}, {"text": "It's their problem, not ___.", "alts": [["ours"]], "hint": "명사 없이", "ko": "그건 그들 문제지 우리 문제가 아니에요."}, {"text": "We went in our car, and they went in ___.", "alts": [["theirs"]], "hint": "명사 없이", "ko": "우리는 우리 차로 가고 그들은 자기 차로 갔어요."}, {"text": "I went to the movies with a friend of ___.", "alts": [["mine"]], "hint": "a friend of", "ko": "친구 한 명이랑 영화 보러 갔어요."}, {"text": "Tom was at the restaurant with a friend of ___.", "alts": [["his"]], "hint": "a friend of", "ko": "톰은 친구 한 명이랑 식당에 있었어요."}, {"text": "Are those people friends of ___?", "alts": [["yours"]], "hint": "friends of", "ko": "저 사람들 당신 친구예요?"}, {"text": "___ phone is this?", "alts": [["Whose"]], "hint": "whose", "ko": "이거 누구 휴대폰이에요?"}, {"text": "\"Is this his jacket or hers?\" \"It's ___.\"", "alts": [["his"]], "hint": "his", "ko": "\"이거 그의 재킷이에요, 그녀 거예요?\" \"그의 거예요.\""}, {"text": "That's not my coffee. ___ is over there.", "alts": [["Mine"]], "hint": "명사 없이", "ko": "그건 제 커피 아니에요. 제 건 저기 있어요."}], "production": [{"ko": "이거 누구 거예요?", "en": "Whose is this?"}, {"ko": "그거 제 거예요.", "en": "That's mine."}, {"ko": "이 우산 당신 거예요?", "en": "Is this umbrella yours?"}, {"ko": "제 휴대폰이 꺼져서 그녀가 자기 것을 빌려줬어요.", "en": "My phone died, so she lent me hers."}, {"ko": "오늘 밤에 친구 한 명이랑 영화 봐요.", "en": "I'm seeing a movie with a friend of mine tonight."}, {"ko": "그건 우리 문제가 아니라 그들 문제예요.", "en": "It's their problem, not ours."}, {"ko": "이건 누구 차예요?", "en": "Whose car is this?"}, {"ko": "그 사람은 제 남편 친구예요.", "en": "He's a friend of my husband's."}]}, {"n": 60, "title": "I/me/my/mine", "chapter": "인칭대명사 정리", "points": ["네 가지 형태: 주어 I/we/you/he/she/they, 목적어 me/us/you/him/her/them, 소유격 my/our/your/his/her/their + 명사, 소유대명사 mine/ours/yours/his/hers/theirs.", "I can see him, but he can't see me. / You give me your number, and I'll give you mine. / She gave him hers."], "fill": [{"text": "I can see him, but he can't see ___.", "alts": [["me"]], "hint": "목적격", "ko": "저는 그가 보이는데 그는 저를 못 봐요."}, {"text": "Give me your number, and I'll give you ___.", "alts": [["mine"]], "hint": "소유대명사", "ko": "번호 알려 주면 제 번호도 알려 줄게요."}, {"text": "\"Do you know that man?\" \"Yes, I know ___, but I can't remember ___ name.\"", "alts": [["him", "his"]], "hint": "목적격, 소유격", "ko": "\"저 남자 알아요?\" \"네, 아는데 이름이 기억 안 나요.\""}, {"text": "We invited her to stay with ___ at ___ house.", "alts": [["us", "our"]], "hint": "목적격, 소유격", "ko": "우리는 그녀를 우리 집에 와서 지내라고 초대했어요."}, {"text": "\"Where are the kids?\" \"They're playing with ___ friends.\"", "alts": [["their"]], "hint": "소유격", "ko": "\"아이들 어디 있어요?\" \"친구들이랑 놀고 있어요.\""}, {"text": "That's my pen. Can you give it to ___?", "alts": [["me"]], "hint": "목적격", "ko": "그거 제 펜이에요. 저한테 줄래요?"}, {"text": "\"Is this your hat?\" \"No, it's ___.\"", "alts": [["yours"]], "hint": "소유대명사", "ko": "\"이거 당신 모자예요?\" \"아니요, 당신 거예요.\""}, {"text": "He didn't have an umbrella, so she gave ___ ___.", "alts": [["him", "hers"]], "hint": "목적격, 소유대명사", "ko": "그는 우산이 없어서 그녀가 자기 걸 줬어요."}, {"text": "I'm going out with a friend of ___ tonight.", "alts": [["mine"]], "hint": "a friend of", "ko": "오늘 밤에 친구 한 명이랑 놀러 나가요."}, {"text": "___ like my new job. ___ boss is really nice.", "alts": [["I", "My"]], "hint": "주격, 소유격", "ko": "새 직장이 좋아요. 상사가 정말 좋아요."}, {"text": "\"Is this Jenny's?\" \"Yes, it's ___.\"", "alts": [["hers"]], "hint": "소유대명사", "ko": "\"이거 제니 거예요?\" \"네, 그녀 거예요.\""}, {"text": "They gave ___ their address, and we gave them ___.", "alts": [["us", "ours"]], "hint": "목적격, 소유대명사", "ko": "그들이 주소를 줘서 우리도 우리 주소를 줬어요."}], "production": [{"ko": "저는 그를 볼 수 있지만 그는 저를 못 봐요.", "en": "I can see him, but he can't see me."}, {"ko": "제 번호 드릴 테니 당신 번호 주세요.", "en": "I'll give you my number, and you give me yours."}, {"ko": "그녀는 우리 집에 자주 와요.", "en": "She often comes to our house."}, {"ko": "그 사람 이름이 기억 안 나요.", "en": "I can't remember his name."}, {"ko": "이건 제 거 아니고 그녀 거예요.", "en": "This isn't mine. It's hers."}, {"ko": "아이들이 친구들이랑 놀고 있어요.", "en": "The kids are playing with their friends."}, {"ko": "그가 펜이 없어서 제 걸 빌려줬어요.", "en": "He didn't have a pen, so I lent him mine."}, {"ko": "그들에게 우리 주소를 줬어요.", "en": "We gave them our address."}]}, {"n": 61, "title": "myself/yourself/themselves, etc.", "chapter": "재귀대명사", "points": ["주어와 목적어가 같은 사람이면 -self/-selves: I looked at myself. / He cut himself. / We enjoyed ourselves. / Help yourself (한 명) / yourselves (여러 명).", "by myself = 혼자 (alone): I went on vacation by myself. each other = 서로: They know each other well. (looked at each other ≠ looked at themselves)"], "fill": [{"text": "I looked at ___ in the mirror.", "alts": [["myself"]], "hint": "재귀", "ko": "거울로 제 모습을 봤어요."}, {"text": "He cut ___ with a knife.", "alts": [["himself"]], "hint": "재귀", "ko": "그는 칼에 베였어요."}, {"text": "She fell off her bike, but she didn't hurt ___.", "alts": [["herself"]], "hint": "재귀", "ko": "그녀는 자전거에서 떨어졌는데 다치진 않았어요."}, {"text": "Please help ___. (to one person)", "alts": [["yourself"]], "hint": "재귀, 한 명", "ko": "마음껏 드세요. (한 명에게)"}, {"text": "Please help ___. (to two or more people)", "alts": [["yourselves"]], "hint": "재귀, 여러 명", "ko": "마음껏 드세요. (두 명 이상에게)"}, {"text": "We had a great vacation. We really enjoyed ___.", "alts": [["ourselves"]], "hint": "재귀", "ko": "휴가 정말 좋았어요. 정말 즐겁게 보냈어요."}, {"text": "They had a nice time. They enjoyed ___.", "alts": [["themselves"]], "hint": "재귀", "ko": "그들은 좋은 시간을 보냈어요. 즐겁게 지냈어요."}, {"text": "You never talk to me. Sometimes I talk to ___.", "alts": [["myself"]], "hint": "재귀", "ko": "당신은 저랑 얘기를 안 해요. 가끔 혼잣말을 해요."}, {"text": "Be careful. Don't hurt ___.", "alts": [["yourself"]], "hint": "재귀", "ko": "조심해요. 다치지 마요."}, {"text": "I went on vacation by ___.", "alts": [["myself"]], "hint": "by -self", "ko": "혼자 휴가를 갔어요."}, {"text": "\"Was she with friends?\" \"No, she was by ___.\"", "alts": [["herself"]], "hint": "by -self", "ko": "\"그녀는 친구들이랑 있었어요?\" \"아니요, 혼자였어요.\""}, {"text": "Kate and Nicole are good friends. They know ___ well.", "alts": [["each other"]], "hint": "서로", "ko": "케이트와 니콜은 친한 친구예요. 서로 잘 알아요."}, {"text": "Paul and I live near ___.", "alts": [["each other"]], "hint": "서로", "ko": "폴이랑 저는 가까이 살아요."}, {"text": "James and Sue looked at ___ and smiled.", "alts": [["each other"]], "hint": "서로", "ko": "제임스와 수는 서로 보고 웃었어요."}, {"text": "My son is 15. He can make dinner by ___.", "alts": [["himself"]], "hint": "by -self", "ko": "아들이 열다섯 살이에요. 혼자 저녁을 차릴 수 있어요."}], "production": [{"ko": "거울로 제 모습을 봤어요.", "en": "I look 했어요.", "en": "Most of my friends are married."}, {"ko": "이 책들 중 몇 권은 아주 오래됐어요.", "en": "Some of these books are really old."}, {"ko": "저희 반 학생들 모두 시험에 합격했어요.", "en": "All the students in my class passed the test."}, {"ko": "제 친구들 중 아무도 담배를 안 피워요.", "en": "None of my friends smoke."}, {"ko": "사람들 대부분은 주말을 좋아해요.", "en": "Most people like weekends."}, {"ko": "케이크를 다 먹었어요.", "en": "I ate all of the cake."}, {"ko": "이 돈은 하나도 필요 없어요.", "en": "I don't need any of this money."}]}, {"n": 80, "title": "both, either, neither", "chapter": "수량", "points": ["둘에 대해: both = 둘 다, either = 둘 중 아무거나, neither = 둘 다 아님. both + 복수 (both cities), either/neither + 단수 (either way, neither job).", "both of / either of / neither of + the/these/my ...: Neither of my parents is Canadian. both A and B / either A or B / neither A nor B. 부정문에는 either (I don't want either, not neither)."], "fill": [{"text": "Rebecca has two kids. ___ are married.", "alts": [["Both"]], "hint": "둘 다", "ko": "레베카는 아이가 둘인데 둘 다 결혼했어요."}, {"text": "\"Tea or coffee?\" \"___. It doesn't matter.\"", "alts": [["Either"]], "hint": "아무거나", "ko": "\"차요, 커피요?\" \"아무거나요. 상관없어요.\""}, {"text": "\"The movies or the theater?\" \"___. I want to stay home.\"", "alts": [["Neither"]], "hint": "둘 다 아님", "ko": "\"영화관이요, 극장이요?\" \"둘 다 싫어요. 집에 있고 싶어요.\""}, {"text": "\"Would you like tea or coffee?\" \"I don't want ___.\"", "alts": [["either"]], "hint": "부정 + either", "ko": "\"차 드실래요, 커피 드실래요?\" \"둘 다 괜찮아요.\""}, {"text": "I went to Miami and Seattle. I liked ___ cities.", "alts": [["both"]], "hint": "both + 복수", "ko": "마이애미랑 시애틀에 갔어요. 두 도시 다 좋았어요."}, {"text": "I worked in an office and a store. ___ job was interesting.", "alts": [["Neither"]], "hint": "neither + 단수", "ko": "사무실이랑 가게에서 일했는데 둘 다 재미없었어요."}, {"text": "There are two ways to the airport. You can go ___ way.", "alts": [["either"]], "hint": "either + 단수", "ko": "공항 가는 길이 두 개 있어요. 아무 쪽으로나 가도 돼요."}, {"text": "___ of my parents is Canadian.", "alts": [["Neither"]], "hint": "neither of", "ko": "부모님 두 분 다 캐나다 사람이 아니에요."}, {"text": "I like ___ of those pictures.", "alts": [["both"]], "hint": "both of", "ko": "저 그림 둘 다 좋아요."}, {"text": "___ Tom and Ann were late.", "alts": [["Both"]], "hint": "both A and B", "ko": "톰과 앤 둘 다 늦었어요."}, {"text": "You can pay ___ by card or in cash.", "alts": [["either"]], "hint": "either A or B", "ko": "카드나 현금 중에 편한 걸로 내시면 돼요."}, {"text": "___ my brother nor my sister lives in Seoul.", "alts": [["Neither"]], "hint": "neither A nor B", "ko": "오빠도 언니도 서울에 안 살아요."}, {"text": "I asked two people, but ___ of them knew the answer.", "alts": [["neither"]], "hint": "neither of", "ko": "두 사람한테 물어봤는데 둘 다 답을 몰랐어요."}, {"text": "We can meet ___ Saturday or Sunday.", "alts": [["either"], ["on either"]], "hint": "either A or B", "ko": "토요일이나 일요일에 만나면 돼요."}], "production": [{"ko": "둘 다 좋아요.", "en": "I like both."}, {"ko": "아무거나 괜찮아요.", "en": "Either is fine."}, {"ko": "둘 다 싫어요.", "en": "I don't like either."}, {"ko": "부모님 두 분 다 선생님이세요.", "en": "Both of my parents are teachers."}, {"ko": "둘 중 아무도 운전을 못 해요.", "en": "Neither of them can drive."}, {"ko": "카드나 현금 둘 중 하나로 내시면 돼요.", "en": "You can pay either by card or in cash."}, {"ko": "저도 남편도 요리를 안 좋아해요.", "en": "Neither my husband nor I like cooking."}, {"ko": "그 두 식당 다 가 봤어요.", "en": "I've been to both restaurants."}]}, {"n": 81, "title": "a lot, much, many", "chapter": "수량", "points": ["much + 셀 수 없는 명사 (much money, much time), many + 복수 명사 (many books, many people). How much ...? / How many ...? a lot of는 둘 다 가능 (a lot of food / a lot of books).", "much/many는 주로 질문·부정문 (I don't drink much coffee), 긍정문은 보통 a lot of (I drink a lot of coffee). 동사 뒤 a lot: I like it a lot. / She goes out a lot. A lot of people speak English (복수 동사)."], "fill": [{"text": "We don't have ___ luggage.", "alts": [["much"]], "hint": "셀 수 없는", "ko": "우리는 짐이 별로 없어요."}, {"text": "We don't know ___ people here.", "alts": [["many"]], "hint": "복수", "ko": "우리는 여기 아는 사람이 별로 없어요."}, {"text": "___ photos did you take?", "alts": [["How many"]], "hint": "복수", "ko": "사진 몇 장 찍었어요?"}, {"text": "___ money do you want?", "alts": [["How much"]], "hint": "셀 수 없는", "ko": "돈이 얼마나 필요해요?"}, {"text": "\"Do you have any money?\" \"I have some, but not ___.\"", "alts": [["much"]], "hint": "셀 수 없는", "ko": "\"돈 있어요?\" \"조금 있는데 많진 않아요.\""}, {"text": "\"Did you take any photos?\" \"I took some, but not ___.\"", "alts": [["many"]], "hint": "복수", "ko": "\"사진 찍었어요?\" \"몇 장 찍었는데 많진 않아요.\""}, {"text": "We bought a ___ of food.", "alts": [["lot"]], "hint": "a lot of", "ko": "우리는 음식을 많이 샀어요."}, {"text": "Do you drink ___ coffee?", "alts": [["much"]], "hint": "질문", "ko": "커피 많이 마셔요?"}, {"text": "I drink ___ coffee. (긍정문)", "alts": [["a lot of"], ["lots of"]], "hint": "긍정문", "ko": "저는 커피를 많이 마셔요."}, {"text": "A lot of people ___ English. (speak)", "alts": [["speak"]], "hint": "복수 동사", "ko": "많은 사람들이 영어를 해요."}, {"text": "There ___ a lot of food at the party.", "alts": [["was"]], "hint": "단수 동사", "ko": "파티에 음식이 많았어요."}, {"text": "I like this song a ___.", "alts": [["lot"]], "hint": "동사 뒤", "ko": "이 노래 정말 좋아요."}, {"text": "She doesn't have ___ free time these days.", "alts": [["much"], ["a lot of"]], "hint": "셀 수 없는", "ko": "그녀는 요즘 자유 시간이 별로 없어요."}, {"text": "How ___ times have you been to Japan?", "alts": [["many"]], "hint": "복수", "ko": "일본 몇 번 가 봤어요?"}, {"text": "I don't go out ___.", "alts": [["much"], ["a lot"]], "hint": "동사 뒤", "ko": "저는 밖에 별로 안 나가요."}], "production": [{"ko": "시간이 많지 않아요.", "en": "I don't have much time."}, {"ko": "여기 아는 사람이 많지 않아요.", "en": "I don't know many people here."}, {"ko": "사진 몇 장 찍었어요?", "en": "How many pictures did you take?"}, {"ko": "돈 얼마나 필요해요?", "en": "How much money do you need?"}, {"ko": "저는 커피를 많이 마셔요.", "en": "I drink a lot of coffee."}, {"ko": "저 그 영화 정말 좋아해요.", "en": "I like that movie a lot."}, {"ko": "요즘 별로 안 나가요.", "en": "I don't go out much these days."}, {"ko": "많은 사람들이 영어를 해요.", "en": "A lot of people speak English."}]}, {"n": 82, "title": "(a) little, (a) few", "chapter": "수량", "points": ["a few + 복수 (a few days, a few questions) = 조금 있음 / a little + 셀 수 없는 (a little water, a little time) = 조금 있음.", "a 없이 few / little = 거의 없음 (부정적): There were few people. / Dan eats very little. 비교: I have a few friends (몇 명 있음) / I have few friends (거의 없음, 외로움)."], "fill": [{"text": "She didn't eat anything, but she drank a ___ water.", "alts": [["little"]], "hint": "셀 수 없는", "ko": "그녀는 아무것도 안 먹고 물만 조금 마셨어요."}, {"text": "I have to make a ___ phone calls.", "alts": [["few"]], "hint": "복수", "ko": "전화 몇 통 해야 해요."}, {"text": "I speak a ___ Spanish.", "alts": [["little"]], "hint": "셀 수 없는", "ko": "저는 스페인어를 조금 해요."}, {"text": "We're going away for a ___ days.", "alts": [["few"]], "hint": "복수", "ko": "우리 며칠 동안 어디 다녀와요."}, {"text": "\"Can you speak English?\" \"A ___.\"", "alts": [["little"]], "hint": "대답", "ko": "\"영어 할 줄 알아요?\" \"조금요.\""}, {"text": "\"Do you have any stamps?\" \"Yes, a ___.\"", "alts": [["few"]], "hint": "대답", "ko": "\"우표 있어요?\" \"네, 몇 장 있어요.\""}, {"text": "The theater was almost empty. There were very ___ people.", "alts": [["few"]], "hint": "거의 없음", "ko": "극장이 거의 비어 있었어요. 사람이 거의 없었어요."}, {"text": "Dan is very thin because he eats very ___.", "alts": [["little"]], "hint": "거의 없음", "ko": "댄은 거의 안 먹어서 아주 말랐어요."}, {"text": "Your English is really good. You make very ___ mistakes.", "alts": [["few"]], "hint": "거의 없음", "ko": "영어 정말 잘하네요. 실수를 거의 안 해요."}, {"text": "I have ___ time. Let's get a coffee. (조금 있음)", "alts": [["a little"]], "hint": "조금 있음", "ko": "시간이 조금 있어요. 커피 한잔해요."}, {"text": "He's lucky. He has ___ good friends. (몇 명 있음)", "alts": [["a few"]], "hint": "조금 있음", "ko": "그는 운이 좋아요. 좋은 친구가 몇 명 있어요."}, {"text": "Hurry up! We have very ___ time.", "alts": [["little"]], "hint": "거의 없음", "ko": "서둘러요! 시간이 거의 없어요."}, {"text": "Can I ask you a ___ questions?", "alts": [["few"]], "hint": "복수", "ko": "몇 가지 물어봐도 돼요?"}, {"text": "Add a ___ salt to the soup.", "alts": [["little"]], "hint": "셀 수 없는", "ko": "국에 소금을 조금 넣어요."}], "production": [{"ko": "영어 조금 해요.", "en": "I speak a little English."}, {"ko": "며칠 동안 여행 가요.", "en": "I'm going away for a few days."}, {"ko": "질문 몇 개 해도 돼요?", "en": "Can I ask you a few questions?"}, {"ko": "시간이 거의 없어요. 서둘러요.", "en": "We have very little time. Hurry up."}, {"ko": "극장에 사람이 거의 없었어요.", "en": "There were very few people in the theater."}, {"ko": "물 조금만 주세요.", "en": "Just a little water, please."}, {"ko": "몇 분 후에 다시 전화할게요.", "en": "I'll call you back in a few minutes."}, {"ko": "그는 실수를 거의 안 해요.", "en": "He makes very few mistakes."}]}, {"n": 83, "title": "old/nice/interesting, etc. (adjectives)", "chapter": "형용사", "points": ["형용사는 명사 앞에: a modern house (a house modern X), famous people. 복수 명사 앞에서도 형태 그대로: different places (differents X).", "be + 형용사 (I'm hungry / The movie was boring). look / feel / smell / taste / sound + 형용사: You look tired. / It smells good. / It sounds interesting. (sounds interestingly X)"], "fill": [{"text": "They live in a ___ house. (modern)", "alts": [["modern"]], "hint": "명사 앞", "ko": "그들은 현대식 집에 살아요."}, {"text": "Have you met any ___? (famous people)", "alts": [["famous people"]], "hint": "형용사 + 명사", "ko": "유명한 사람 만나 본 적 있어요?"}, {"text": "I've been to many ___ places. (different)", "alts": [["different"]], "hint": "형태 그대로", "ko": "저는 여러 곳에 가 봤어요."}, {"text": "Jessica has ___ eyes. (brown)", "alts": [["brown"]], "hint": "명사 앞", "ko": "제시카는 눈이 갈색이에요."}, {"text": "I'm ___. Can I have something to eat?", "alts": [["hungry"]], "hint": "be + 형용사", "ko": "배고파요. 먹을 것 좀 있어요?"}, {"text": "The movie wasn't very good. It was ___.", "alts": [["boring"]], "hint": "be + 형용사", "ko": "영화가 별로였어요. 지루했어요."}, {"text": "You look ___. Did you sleep well?", "alts": [["tired"]], "hint": "look + 형용사", "ko": "피곤해 보여요. 잘 잤어요?"}, {"text": "Mmm. This soup ___ good.", "alts": [["smells"], ["tastes"]], "hint": "smell + 형용사", "ko": "음. 이 국 냄새 좋네요."}, {"text": "Eric told me about his new job. It ___ really interesting.", "alts": [["sounds"]], "hint": "sound + 형용사", "ko": "에릭이 새 직장 얘기를 해 줬어요. 정말 재밌을 것 같아요."}, {"text": "I don't ___ very well. I think I have a cold.", "alts": [["feel"]], "hint": "feel + 형용사", "ko": "몸이 좀 안 좋아요. 감기 걸린 것 같아요."}, {"text": "There are some beautiful ___ flowers in the yard. (yellow)", "alts": [["yellow"]], "hint": "명사 앞", "ko": "마당에 예쁜 노란 꽃이 좀 있어요."}, {"text": "You ___ happy today. What happened?", "alts": [["look"], ["sound"]], "hint": "look + 형용사", "ko": "오늘 행복해 보여요. 무슨 일 있어요?"}, {"text": "This coffee ___ terrible.", "alts": [["tastes"]], "hint": "taste + 형용사", "ko": "이 커피 맛이 정말 별로예요."}, {"text": "Please be ___. I'm reading.", "alts": [["quiet"]], "hint": "be + 형용사", "ko": "조용히 해 주세요. 책 읽고 있어요."}], "production": [{"ko": "피곤해 보여요.", "en": "You look tired."}, {"ko": "냄새 좋다!", "en": "It smells good!"}, {"ko": "재미있겠네요.", "en": "That sounds fun."}, {"ko": "오늘 몸이 별로예요.", "en": "I don't feel well today."}, {"ko": "그들은 오래된 집에 살아요.", "en": "They live in an old house."}, {"ko": "이 수프 맛있어요.", "en": "This soup tastes great."}, {"ko": "그 영화는 지루했어요.", "en": "The movie was boring."}, {"ko": "그녀는 긴 검은 머리를 가졌어요.", "en": "She has long black hair."}]}, {"n": 84, "title": "quickly/badly/suddenly, etc. (adverbs)", "chapter": "부사", "points": ["부사(형용사 + -ly)는 동작이 어떻게 일어나는지 말해요: quick → quickly, careful → carefully, easy → easily, heavy → heavily. Listen carefully! (listen careful X)", "형용사 = 상태 (Sue is quiet / Be careful), 부사 = 동작 (Sue speaks quietly). hard / fast / early / late는 형용사와 부사가 같아요 (works hard, hardly X). good의 부사는 well."], "fill": [{"text": "He ate his dinner very ___. (quick)", "alts": [["quickly"]], "hint": "부사", "ko": "그는 저녁을 아주 빨리 먹었어요."}, {"text": "___, the shelf fell down. (sudden)", "alts": [["Suddenly"]], "hint": "부사", "ko": "갑자기 선반이 무너졌어요."}, {"text": "Please listen ___. (careful)", "alts": [["carefully"]], "hint": "부사", "ko": "잘 들어 주세요."}, {"text": "It's raining ___. (heavy)", "alts": [["heavily"], ["hard"]], "hint": "부사", "ko": "비가 많이 와요."}, {"text": "Sue speaks very ___. (quiet)", "alts": [["quietly"]], "hint": "부사", "ko": "수는 아주 조용히 말해요."}, {"text": "Sue is very ___. (quiet)", "alts": [["quiet"]], "hint": "형용사", "ko": "수는 아주 조용해요."}, {"text": "Our team played ___. (bad)", "alts": [["badly"]], "hint": "부사", "ko": "우리 팀은 경기를 못했어요."}, {"text": "Be ___! (careful)", "alts": [["careful"]], "hint": "형용사", "ko": "조심해요!"}, {"text": "Sue works very ___.", "alts": [["hard"]], "hint": "hard (hardly X)", "ko": "수는 정말 열심히 일해요."}, {"text": "Ben can run ___.", "alts": [["fast"]], "hint": "fast", "ko": "벤은 빨리 달릴 수 있어요."}, {"text": "You speak English very ___. (good)", "alts": [["well"]], "hint": "good → well", "ko": "영어를 정말 잘하시네요."}, {"text": "Your English is very ___.", "alts": [["good"]], "hint": "형용사", "ko": "영어 실력이 정말 좋아요."}, {"text": "I went to bed ___ last night. (late)", "alts": [["late"]], "hint": "late", "ko": "어젯밤에 늦게 잤어요."}, {"text": "I passed the test ___. It wasn't hard. (easy)", "alts": [["easily"]], "hint": "부사", "ko": "시험에 쉽게 붙었어요. 어렵지 않았어요."}, {"text": "I waited ___. I felt nervous. (nervous)", "alts": [["nervously"]], "hint": "부사", "ko": "긴장한 채로 기다렸어요. 긴장됐어요."}], "production": [{"ko": "천천히 말해 주세요.", "en": "Please speak slowly."}, {"ko": "그녀는 영어를 잘해요.", "en": "She speaks English well."}, {"ko": "그는 정말 열심히 일해요.", "en": "He works really hard."}, {"ko": "조심히 운전하세요.", "en": "Drive carefully."}, {"ko": "갑자기 불이 꺼졌어요.", "en": "Suddenly, the lights went out."}, {"ko": "그 사람 말을 완벽하게 이해했어요.", "en": "I understood him perfectly."}, {"ko": "비가 많이 오고 있어요.", "en": "It's raining heavily."}, {"ko": "우리 팀이 경기를 못했어요.", "en": "Our team played badly."}]}, {"n": 85, "title": "old/older, expensive/more expensive", "chapter": "비교급", "points": ["짧은 단어(1음절) → -er: cheap → cheaper, old → older, big → bigger, hot → hotter, nice → nicer. -y로 끝나면 → -ier: easy → easier, heavy → heavier, early → earlier.", "긴 단어(2음절 이상) → more ...: more expensive, more careful, more interesting. 불규칙: good/well → better, bad/badly → worse, far → farther."], "fill": [{"text": "Rome is old, but Athens is ___.", "alts": [["older"]], "hint": "-er", "ko": "로마는 오래됐지만 아테네는 더 오래됐어요."}, {"text": "Is it ___ to go by car or by train? (cheap)", "alts": [["cheaper"]], "hint": "-er (more cheap X)", "ko": "차로 가는 게 싸요, 기차로 가는 게 싸요?"}, {"text": "Helen wants a ___ car. (big)", "alts": [["bigger"]], "hint": "자음 두 번", "ko": "헬렌은 더 큰 차를 원해요."}, {"text": "Don't take the bus. It's ___ to take a taxi. (easy)", "alts": [["easier"]], "hint": "-ier", "ko": "버스 타지 마요. 택시 타는 게 더 편해요."}, {"text": "This coat is OK, but the other one is ___. (nice)", "alts": [["nicer"]], "hint": "-r", "ko": "이 코트 괜찮은데 다른 게 더 예뻐요."}, {"text": "You should be ___. (careful)", "alts": [["more careful"]], "hint": "more", "ko": "좀 더 조심해야 해요."}, {"text": "This book is ___ than that one. (interesting)", "alts": [["more interesting"]], "hint": "more", "ko": "이 책이 저 책보다 더 재밌어요."}, {"text": "The weather today is ___ than yesterday. (good)", "alts": [["better"]], "hint": "불규칙", "ko": "오늘 날씨가 어제보다 좋아요."}, {"text": "My cold is ___ today. I feel terrible. (bad)", "alts": [["worse"]], "hint": "불규칙", "ko": "오늘 감기가 더 심해요. 너무 힘들어요."}, {"text": "\"Is the station a mile away?\" \"No, it's ___.\" (far)", "alts": [["farther"], ["further"]], "hint": "불규칙", "ko": "\"역까지 1마일이에요?\" \"아니요, 더 멀어요.\""}, {"text": "Today is ___ than yesterday. (hot)", "alts": [["hotter"]], "hint": "자음 두 번", "ko": "오늘이 어제보다 더 더워요."}, {"text": "I'm getting up ___ these days. (early)", "alts": [["earlier"]], "hint": "-ier", "ko": "요즘 더 일찍 일어나요."}, {"text": "Phones are ___ than before. (expensive)", "alts": [["more expensive"]], "hint": "more", "ko": "휴대폰이 예전보다 더 비싸요."}, {"text": "This bag is ___ than mine. (heavy)", "alts": [["heavier"]], "hint": "-ier", "ko": "이 가방이 제 것보다 더 무거워요."}], "production": [{"ko": "오늘은 어제보다 더 추워요.", "en": "It's colder today than yesterday."}, {"ko": "택시 타는 게 더 쉬워요.", "en": "It's easier to take a taxi."}, {"ko": "더 큰 집에 살고 싶어요.", "en": "I want to live in a bigger house."}, {"ko": "이게 더 비싸요.", "en": "This one is more expensive."}, {"ko": "기분이 좀 나아졌어요.", "en": "I feel better now."}, {"ko": "상황이 더 나빠졌어요.", "en": "Things got worse."}, {"ko": "더 조심해야 해요.", "en": "You need to be more careful."}, {"ko": "요즘 더 일찍 일어나요.", "en": "I'm getting up earlier these days."}]}, {"n": 86, "title": "older than ..., more expensive than ...", "chapter": "비교급", "points": ["비교급 + than: Athens is older than Rome. / It's easier to take a taxi than the bus. / Better than yesterday. 뒤에 me/him/her/us/them 또는 I am / he can / she did.", "more than / less than (more than $100, less than an hour). 차이: much/a lot/far + 비교급 (much bigger), a little/a bit + 비교급 (a little older)."], "fill": [{"text": "Athens is older ___ Rome.", "alts": [["than"]], "hint": "than", "ko": "아테네가 로마보다 오래됐어요."}, {"text": "Are oranges more expensive ___ bananas?", "alts": [["than"]], "hint": "than", "ko": "오렌지가 바나나보다 비싸요?"}, {"text": "\"How are you today?\" \"Not bad. ___ than yesterday.\"", "alts": [["Better"]], "hint": "better than", "ko": "\"오늘 어때요?\" \"나쁘지 않아요. 어제보다 나아요.\""}, {"text": "The restaurant is more crowded ___ usual.", "alts": [["than"]], "hint": "than usual", "ko": "식당이 평소보다 더 붐벼요."}, {"text": "I can run faster than ___. (he)", "alts": [["him"], ["he can"]], "hint": "than me/him", "ko": "제가 그보다 더 빨리 달릴 수 있어요."}, {"text": "You're a better singer than ___. (I)", "alts": [["me"], ["I am"]], "hint": "than me", "ko": "당신이 저보다 노래를 더 잘해요."}, {"text": "\"Did your shoes cost $100?\" \"No, more ___ that.\"", "alts": [["than"]], "hint": "more than", "ko": "\"신발 100달러였어요?\" \"아니요, 그것보다 더 비쌌어요.\""}, {"text": "The movie was short, ___ than an hour.", "alts": [["less"]], "hint": "less than", "ko": "영화가 짧았어요. 한 시간도 안 됐어요."}, {"text": "They have more money ___ they need.", "alts": [["than"]], "hint": "than", "ko": "그들은 필요한 것보다 돈이 더 많아요."}, {"text": "My brother is ___ older than me. (훨씬)", "alts": [["much"], ["a lot"], ["far"]], "hint": "much + 비교급", "ko": "오빠는 저보다 나이가 훨씬 많아요."}, {"text": "Her English is ___ better than mine. (조금)", "alts": [["a little"], ["a bit"], ["slightly"]], "hint": "a little + 비교급", "ko": "그녀 영어가 제 것보다 조금 더 나아요."}, {"text": "This phone is ___ cheaper than that one. (훨씬)", "alts": [["much"], ["a lot"], ["far"]], "hint": "much + 비교급", "ko": "이 휴대폰이 저것보다 훨씬 싸요."}, {"text": "I got up earlier than ___ did. (she)", "alts": [["she"]], "hint": "than she did", "ko": "제가 그녀보다 더 일찍 일어났어요."}, {"text": "Seoul is much ___ than my hometown. (big)", "alts": [["bigger"]], "hint": "비교급", "ko": "서울은 제 고향보다 훨씬 커요."}], "production": [{"ko": "저는 언니보다 키가 커요.", "en": "I'm taller than my sister."}, {"ko": "지하철이 버스보다 빨라요.", "en": "The subway is faster than the bus."}, {"ko": "오늘은 어제보다 훨씬 더워요.", "en": "It's much hotter today than yesterday."}, {"ko": "그는 저보다 조금 나이가 많아요.", "en": "He's a little older than me."}, {"ko": "생각보다 비쌌어요.", "en": "It was more expensive than I thought."}, {"ko": "한 시간도 안 걸렸어요.", "en": "It took less than an hour."}, {"ko": "평소보다 사람이 많아요.", "en": "It's more crowded than usual."}, {"ko": "100달러 넘게 들었어요.", "en": "It cost more than 100 dollars."}]}, {"n": 87, "title": "not as ... as", "chapter": "비교", "points": ["not as + 형용사/부사 + as = ~만큼 ~하지 않아요: Rome is not as old as Athens. (= Athens is older) / I don't play as often as you.", "not as much ... as / not as many ... as: I don't have as much money as you. 비교급에는 than (older than, older as X), as ... as에는 as. the same as: My hair is the same color as yours."], "fill": [{"text": "Box A isn't ___ big ___ Box B.", "alts": [["as", "as"]], "hint": "not as ... as", "ko": "A 상자는 B 상자만큼 크지 않아요."}, {"text": "Rome is not as old ___ Athens.", "alts": [["as"]], "hint": "as ... as", "ko": "로마는 아테네만큼 오래되지 않았어요."}, {"text": "Athens is older ___ Rome.", "alts": [["than"]], "hint": "비교급 + than", "ko": "아테네가 로마보다 오래됐어요."}, {"text": "The Grand Hotel isn't as ___ as the Western. (expensive)", "alts": [["expensive"]], "hint": "형용사 원형", "ko": "그랜드 호텔은 웨스턴만큼 비싸지 않아요."}, {"text": "I don't play soccer as ___ as you.", "alts": [["often"]], "hint": "부사", "ko": "저는 당신만큼 축구를 자주 하지 않아요."}, {"text": "I ""}, {"text": "Bill will be here soon. He hasn't come ___.", "alts": [["yet"]], "hint": "yet (부정)", "ko": "빌 곧 올 거예요. 아직 안 왔어요."}, {"text": "\"Where's Emma?\" \"She isn't here ___.\"", "alts": [["yet"]], "hint": "yet (부정)", "ko": "\"엠마 어디 있어요?\" \"아직 안 왔어요.\""}, {"text": "\"Are you ready?\" \"Not ___. In a minute.\"", "alts": [["yet"]], "hint": "not yet", "ko": "\"준비됐어요?\" \"아직이요. 잠깐만요.\""}, {"text": "Has the movie started ___?", "alts": [["yet"]], "hint": "yet (질문)", "ko": "영화 벌써 시작했어요?"}, {"text": "\"What time is Joe coming?\" \"He's ___ here.\"", "alts": [["already"]], "hint": "already", "ko": "\"조 몇 시에 와요?\" \"벌써 왔어요.\""}, {"text": "\"Do you want lunch?\" \"No, thanks. I've ___ eaten.\"", "alts": [["already"]], "hint": "already", "ko": "\"점심 먹을래요?\" \"아니요, 괜찮아요. 벌써 먹었어요.\""}, {"text": "I'm ___ hungry. I ate a lot, but I'm still hungry.", "alts": [["still"]], "hint": "still", "ko": "아직도 배고파요. 많이 먹었는데 여전히 배고파요."}, {"text": "He ___ hasn't called me. I'm worried.", "alts": [["still"]], "hint": "still (부정 앞)", "ko": "그는 아직도 전화를 안 했어요. 걱정돼요."}, {"text": "\"What are you doing tonight?\" \"I don't know ___.\"", "alts": [["yet"]], "hint": "yet", "ko": "\"오늘 밤에 뭐 해요?\" \"아직 모르겠어요.\""}, {"text": "Wow, you've ___ finished? That was fast!", "alts": [["already"]], "hint": "already", "ko": "와, 벌써 끝냈어요? 빠르네요!"}, {"text": "Is it ___ raining? I want to go out.", "alts": [["still"]], "hint": "still", "ko": "아직 비 와요? 나가고 싶은데."}], "production": [{"ko": "아직도 비 와요?", "en": "Is it still raining?"}, {"ko": "그는 아직 안 왔어요.", "en": "He hasn't come yet."}, {"ko": "벌써 끝났어요?", "en": "Are you done already?"}, {"ko": "이미 점심 먹었어요.", "en": "I've already had lunch."}, {"ko": "아직 서울 살아요?", "en": "Do you still live in Seoul?"}, {"ko": "\"준비됐어요?\" \"아직이요.\"", "en": "\"Are you ready?\" \"Not yet.\""}, {"ko": "아직 결정 못 했어요.", "en": "I haven't decided yet."}, {"ko": "그는 아직도 전화를 안 했어요.", "en": "He still hasn't called."}]}, {"n": 94, "title": "Give me that book! Give it to me!", "chapter": "어순", "points": [  "en": "The bus stop is just around the corner."}, {"ko": "우리는 강을 따라 걸었어요.", "en": "We walked along the river."}, {"ko": "터널을 지나갔어요.", "en": "We drove through the tunnel."}, {"ko": "길을 건너서 오른쪽으로 가세요.", "en": "Go across the street and turn right."}, {"ko": "테이블에서 발 내려요.", "en": "Take your feet off the table."}]}, {"n": 109, "title": "on, at, by, with, about", "chapter": "전치사", "points": ["on vacation, on TV, on the radio, on the phone, on fire, on time. at the age of 21, at 100 degrees. by bus/car/train/plane/bike (하지만 on foot), a book by ..., 수동태 by.", "with / without (with milk, without me, a man with a beard, a woman with glasses, cut with scissors). about (talk/think/know about ..., a program about ...)."], "fill": [{"text": "Megan isn't at work this week. She's ___ vacation.", "alts": [["on"]], "hint": "on vacation", "ko": "메건은 이번 주에 회사에 없어요. 휴가 중이에요."}, {"text": "We watched the news ___ TV.", "alts": [["on"]], "hint": "on TV", "ko": "TV로 뉴스를 봤어요."}, {"text": "I spoke to Rachel ___ the phone last night.", "alts": [["on"]], "hint": "on the phone", "ko": "어젯밤에 레이첼이랑 통화했어요."}, {"text": "The house is ___ fire! Call 119.", "alts": [["on"]], "hint": "on fire", "ko": "집에 불이 났어요! 119에 전화해요."}, {"text": "\"Was the train late?\" \"No, it was ___ time.\"", "alts": [["on"]], "hint": "on time", "ko": "\"기차 늦었어요?\" \"아니요, 제시간에 왔어요.\""}, {"text": "Olivia got married ___ 21.", "alts": [["at"]], "hint": "at + 나이", "ko": "올리비아는 21살에 결혼했어요."}, {"text": "Do you like traveling ___ train?", "alts": [["by"]], "hint": "by + 교통", "ko": "기차 여행 좋아해요?"}, {"text": "You can't get there by car. You have to go ___ foot.", "alts": [["on"]], "hint": "on foot", "ko": "거기는 차로 못 가요. 걸어서 가야 해요."}, {"text": "Have you read any books ___ Haruki Murakami?", "alts": [["by"]], "hint": "작가", "ko": "무라카미 하루키 책 읽어 봤어요?"}, {"text": "I was bitten ___ a dog.", "alts": [["by"]], "hint": "수동태", "ko": "개한테 물렸어요."}, {"text": "Do you like your coffee ___ or ___ milk?", "alts": [["with", "without"]], "hint": "with/wi ]], "hint": "look out", "ko": "조심해요! 차 와요."}, {"text": "Sarah works ___ at the gym three times a week.", "alts": [["out"]], "hint": "work out", "ko": "사라는 일주일에 세 번 헬스장에서 운동해요."}, {"text": "Come ___! Everybody is waiting for you.", "alts": [["on"]], "hint": "come on", "ko": "어서요! 다들 기다리고 있어요."}, {"text": "Sorry I interrupted. Go ___.", "alts": [["on"]], "hint": "go on", "ko": "끼어들어서 미안해요. 계속하세요."}, {"text": "I asked them to be quiet, but they kept ___ talking.", "alts": [["on"]], "hint": "keep on", "ko": "조용히 해 달라고 했는데 계속 떠들었어요."}, {"text": "Can you hold ___ a minute?", "alts": [["on"]], "hint": "hold on", "ko": "잠깐만 기다려 줄래요?"}, {"text": "The plane took ___ 20 minutes late.", "alts": [["off"]], "hint": "take off", "ko": "비행기가 20분 늦게 이륙했어요."}, {"text": "My alarm didn't go ___ this morning.", "alts": [["off"]], "hint": "go off", "ko": "오늘 아침에 알람이 안 울렸어요."}, {"text": "After the party, it took two hours to clean ___.", "alts": [["up"]], "hint": "clean up", "ko": "파티 끝나고 치우는 데 두 시간 걸렸어요."}, {"text": "I know it's hard, but don't give ___.", "alts": [["up"]], "hint": "give up", "ko": "힘든 거 알지만 포기하지 마요."}, {"text": "What does your son want to do when he grows ___?", "alts": [["up"]], "hint": "grow up", "ko": "아드님은 커서 뭐 하고 싶어 해요?"}, {"text": "Hurry ___! We don't have much time.", "alts": [["up"]], "hint": "hurry up", "ko": "서둘러요! 시간이 별로 없어요."}, {"text": "I can't hear you. Can you speak ___?", "alts": [["up"]], "hint": "speak up", "ko": "안 들려요. 좀 크게 말해 줄래요?"}, {"text": "I often wake ___ in the middle of the night.", "alts": [["up"]], "hint": "wake up", "ko": "저는 한밤중에 자주 깨요."}, {"text": "You're driving too fast. Slow ___!", "alts": [["down"]], "hint": "slow down", "ko": "너무 빨리 달려요. 속도 줄여요!"}, {"text": "I was late because my car broke ___.", "alts": [["down"]], "hint": "break down", "ko": "차가 고장 나서 늦었어요."}, {"text": "Sam doesn't get ___ with his father.", "alts": [["along"]], "hint": "get along", "ko": "샘은 아버지랑 사이가 안 좋아요."}, {"text": "I fell ___ because my shoes were too big.", "alts": [["over"]], "hint": "fall over", "ko": "신발이 너무 커서 넘어졌어요."}], "production": [{"ko": "조심해요! 차 와요.", "en": "Watch out! There's a car coming."}, {"ko": "저는 일주일에 세 번 운동해요.", "en": "I work out three times a week."}, {"ko": "잠깐만 기다려 주세요.", "en": "Hold on a minute, please."}, {"ko": "포기하지 마세요.", "en": "Don't give up."}, {"ko": "서둘러요! 늦겠어요.", "en": "Hurry up! We're going to be late."}, {"ko": "좀 크게 말해 줄래요?", "en": "Can you speak up, please?"}, {"ko": "차가 고속도로에서 고장 났어요.", "en": "My car broke down on the highway."}, {"ko": "저는 밤에 자주 깨요.", "en": "I often wake up at night."}, {"ko": "천천히 운전하세요.", "en": "Slow down."}, {"ko": "저는 동료들과 잘 지내요.", "en": "I get along well with my coworkers."}, {"ko": "비행기가 늦게 이륙했어요.", "en": "The plane took off late."}, {"ko": "앉으세요.", "en": "Please sit down."}, {"ko": "그는 다음 주에 돌아와요.", "en": "He'll be back next week."}, {"ko": "계속 말해 보세요.", "en": "Go on."}]}, {"n": 113, "title": "put on your shoes, put your shoes on (phrasal verbs 2)", "chapter": "구동사", "points": ["목적어가 있는 구동사는 두 순서 가능: put on your coat / put your coat on. 하지만 it/them은 반드시 가운데: put it on (put on it X), take them off.", "turn on/off, pick up, put down, bring/take/give/put back, (Appendix 7) fill out, put out, cross out, try on, give up, look up, turn up/down, wake up 사람, tear down, knock over, throw away, put away, pay back, show around."], "fill": [{"text": "It was cold, so I put ___ my coat.", "alts": [["on"]], "hint": "put on", "ko": "추워서 코트를 입었어요."}, {"text": "Your shoes are dirty. Take ___ off.", "alts": [["them"]], "hint": "them + off", "ko": "신발이 더러워요. 벗어요."}, {"text": "Here's your coat. Put ___ on.", "alts": [["it"]], "hint": "it + on", "ko": "여기 코트요. 입어요."}, {"text": "It was dark, so I turned ___ the light.", "alts": [["on"]], "hint": "turn on", "ko": "어두워서 불을 켰어요."}, {"text": "I don't want to watch this. You can turn it ___.", "alts": [["off"]], "hint": "turn off", "ko": "이거 보기 싫어요. 꺼도 돼요."}, {"text": "Those are my keys on the floor. Can you pick ___ ___ for me?", "alt  [["away"]], "hint": "put away", "ko": "아이들은 놀고 나서 장난감을 치웠어요."}, {"text": "Thanks for the money. I'll pay you ___ next week.", "alts": [["back"]], "hint": "pay back", "ko": "돈 고마워요. 다음 주에 갚을게요."}, {"text": "We visited a factory, and the manager showed us ___.", "alts": [["around"]], "hint": "show around", "ko": "공장을 방문했는데 매니저가 구경시켜 줬어요."}, {"text": "They're going to tear ___ the old school.", "alts": [["down"]], "hint": "tear down", "ko": "그들은 오래된 학교를 허물 거예요."}], "production": [{"ko": "신발 벗어 주세요.", "en": "Please take off your shoes."}, {"ko": "추우니까 코트 입어요.", "en": "It's cold. Put your coat on."}, {"ko": "불 좀 켜 줄래요?", "en": "Can you turn on the light?"}, {"ko": "이 서류 작성해 주세요.", "en": "Please fill out this form."}, {"ko": "이거 입어 봐도 돼요?", "en": "Can I try this on?"}, {"ko": "그 단어 사전에서 찾아봤어요.", "en": "I looked the word up in the dictionary."}, {"ko": "음악 소리 좀 줄여 줄래요?", "en": "Can you turn the music down?"}, {"ko": "내일 6시에 깨워 줄래요?", "en": "Can you wake me up at six tomorrow?"}, {"ko": "다음 주에 돈 갚을게요.", "en": "I'll pay you back next week."}, {"ko": "그거 버리지 마세요.", "en": "Don't throw it away."}, {"ko": "담배 끊었어요.", "en": "I gave up smoking."}, {"ko": "다 쓰고 제자리에 갖다 놔요.", "en": "Put it back when you're done."}, {"ko": "바닥에 떨어진 거 주워 줄래요?", "en": "Can you pick that up off the floor?"}, {"ko": "회사 구경시켜 드릴게요.", "en": "I'll show you around the office."}]}], "verbs": [{"v": "get up", "past": "got up", "pp": "gotten up", "ko": "일어나다", "rest": "early", "moment": true}, {"v": "wake up", "past": "woke up", "pp": "woken up", "ko": "잠에서 깨다", "rest": "at six", "moment": true}, {"v": "go", "past": "went", "pp": "gone", "ko": "가다", "rest": "to the gym", "moment": false}, {"v": "have", "past": "had", "pp": "had", "ko": "먹다", "rest": "breakfast at home", "moment": false}, {"v": "make", "past": "made", "pp": "made", "ko": "만들다", "rest": "dinner", "moment": false}, {"v": "do", "past": "did", "pp": "done", "ko": "하다", "rest": "the laundry", "moment": false}, {"v": "take", "past": "took", "pp": "ta <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const app = document.getElementById('app');
const DAY = 864e5;
// Ryan 2026-10-31: students see only 수업별 복습. The other features stay in the code; the teacher can open them
// from the admin screen ("숨긴 기능까지 써 보기"), which switches this on for that teacher view only.
let EXTRAS = false;
let GROUPS = null; // admin: class (반) names, including empty ones
const INTERVALS = [0, 1, 2, 4, 8, 16, 32]; // days per box
let me = null, state = {};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function say() {}
const sayBtn = () => ''; // listening removed (Ryan 2026-10-30)
app.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b) say(b.dataset.say); });

async function sha(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}

// ---------- items ----------
function lessonsOf(st) { return st.memos.map(id => DATA.memos[id]).filter(Boolean).sort((a, b) => b.date.localeCompare(a.date)); }
function cardsOf(st) {
  const out = [];
  for (const m of lessonsOf(st)) {
    m.expressions.forEach((x, i) => { if (x.meaning || x.situation) out.push({ id: `e:${m.id}:${i}`, kind: 'card', memo: m, x }); });
    (m.sentences || []).forEach((x, i) => { if (x.hl.length) out.push({ id: `s:${m.id}:${i}`, kind: 'sent', memo: m, x }); });
  }
  return out;
}
function quizOf(st) {
  const out = [];
  for (const m of lessonsOf(st)) {
    m.fill.forEach((q, i) => out.push({ id: `f:${m.id}:${i}`, kind: 'fill', memo: m, q }));
    m.production.forEach((q, i) => out.push({ id: `p:${m.id}:${i}`, kind: 'prod', memo: m, q }));
  }
  return out;
}
const box = id => (state[id]?.box ?? -1);
function grade(id, g) { // g: 0 again, 1 hard, 2 good
  const s = state[id] || { box: 0, seen: 0, wrong: 0 };
  s.seen++;
  if (g === 0) { s.box = 0; s.wrong++; s.due = Date.now() + 10 * 6e4; }
  else if (g === 1) { s.box = Math.max(1, s.box); s.due = Date.now() + DAY; }
  else { s.box = Math.min(INTERVALS.length - 1, s.box + 1); s.due = Date.now() + INTERVALS[s.box] * DAY; }
  s.t = Date.now(); state[id] = s;
  const d = state._days = state._days || {}; d[today()] = (d[today()] || 0) + 1;
  saveSoon();
}
function dueCards() {
  const all = cardsOf(me), now = Date.now();
  const due = [...all, ...wordCards()].filter(c => state[c.id] && state[c.id].due <= now);
  const fresh = all.filter(c => !state[c.id]).slice(0, Math.max(0, 10 - due.length));
  return [...due, ...fresh];
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pickQuiz(pool, n = 10) {
  // Weight: never seen or often wrong items come up more.
  const w = it => { const s = state[it.id]; if (!s) return 3; return 1 + s.wrong * 2 + Math.max(0, 3 - s.box) + (s.due <= Date.now() ? 2 : 0); };
  const bag = pool.map(it => ({ it, k: Math.random() ** (1 / w(it)) })).sort((a, b) => b.k - a.k);
  return bag.slice(0, n).map(b => b.it);
}
const join = (a, b, c) => [a, b].filter(Boolean).join(' ') + (/^[.,?!]/.test(c) ? '' : ' ') + c;
const norm = s => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();

// Memos a student sees: the ones the site build assigned plus any Ryan picked on the admin screen.
const memosFor = s => [...new Set([...(DATA.assign[s.id] || []), ...(s.memos || [])])];
const nameKey = n => String(n || '').replace(/\s+/g, '').replace(/님$/, '').toLowerCase();
let saveTimer = null;
// Progress follows the student across devices: every item carries its own time (t), and the server
// merges by keeping the newer copy of each item, so a laptop and a phone never wipe each other's work.
function mergeState(a, b) {
  const out = { ...a };
  for (const [k, v] of Object.entries(b || {})) {
    if (k === '_days') { const d = { ...(a._days || {}) }; for (const [day, n] of Object.entries(v || {})) d[day] = Math.max(d[day] || 0, n); out._days = d; }
    else if (!(k in out) || ((v && v.t) || 0) >= ((out[k] && out[k].t) || 0)) out[k] = v;
  }

}
async function saveNow() {
  if (!me || me.viewOnly) return;
  clearTimeout(saveTimer);
  try { const merged = await api.saveProgress(me.token, state); if (merged && typeof merged === 'object') state = mergeState(state, merged); } catch {}
}
function saveSoon() { if (me.viewOnly) return; clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 800); }
document.addEventListener('visibilitychange', async () => {
  if (!me || me.viewOnly) return;
  if (document.hidden) return saveNow();

function markSpot(kind, list, i, extra) {

}
function resume() {
  const r = state._resume; if (!r || r.done) return home();
  const all = new Map([...cardsOf(me), ...quizOf(me)].map(x => [x.id, x]));
  const get = id => all.get(id) || itemById(id);
  const list = r.ids.map(get).filter(Boolean);
  const i = r.ids.slice(0, r.i).filter(id => get(id)).length;
  if (r.deadline && r.deadline > Date.now()) QUIZ_DEADLINE = r.deadline;
  return r.kind === 'cards' ? cards(list, i, r.res) : quiz(list, null, i, r.right);
}

const GOAL = 15; // reviews per day for the ring
const today = () => new Date().toLocaleDateString('sv-SE');
function streak() {
  const days = state._days || {}; let n = 0; const d = new Date();
  if (!days[today()]) d.setDate(d.getDate() - 1);
  while (days[d.toLocaleDateString('sv-SE')]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function ring(done, goal) {

}

// Stories are cut into chunks of 2-3 sentences; while one sentence is practised only that sentence is shown.
function splitSent(t, ko) {

function pager(box, sel = '.expr') {

function bindReveal() {

    : /\b(was|were|did|didn't|wasn't|weren't)\b/i.test(t) ? '지난 일 (과거형)'

// 영작 check: the student's words against the model answer, word by word (common words kept in order = LCS).
function compareAns(mine, model) {

  const W = t => t.replace(/[’‘`]/g, "'").replace(/\b(can)'t\b/gi, '$1 not').replace(/\bwon't\b/gi, 'will not').replace(/n't\b/gi, ' not').replace(/'m\b/gi, ' am').replace(/'re\b/gi, ' are').replace(/'ve\b/gi, ' have').replace(/'ll\b/gi, ' will').replace(/'d\b/gi, ' would').replace(/\b(it|that|he|she|there|here|what|who|where)'s\b/gi, '$1 is').split(/\s+/).filter(Boolean), key = w => norm(w);

  while (x < n && y < k) { if (key(a[x]) === key(b[y])) { okA.add(x++); okB.add(y++); } else if (L[x + 1][y] >= L[x][y + 1]) x++; else y++; }

  const mineH = a.map((w, j) => okA.has(j) ? esc(w) : `<s style="color:var(--bad)">${esc(w)}</s>`).join(' ');
  const miss = b.filter((_, j) => !okB.has(j));
  return `<div class="feedback no"><span class="label">내 답</span><div style="margin-top:4px;color:var(--ink)">${mineH}</div>${miss.length ? `<div style="margin-top:6px">빠진 말: <b>${esc(miss.join(' · '))}</b></div>` : ''}<div class="muted" style="margin-top:4px;font-size:.85rem">줄 그은 말은 모범 답안에 없는 말이에요. 뜻이 같으면 맞은 거예요.</div></div>`;
}

  // Teacher view: browse as a student (or all memos) without saving anything to their progress.
  const viewAs = (who, memos, st, full = false) => { ss.set('nyft:viewas', { sid: who.id === 'teacher' ? null : who.id, name: who.name, full }); ss.set('nyft:nav', null); EXTRAS = full; me = { ...who, memos, viewOnly: true, token: null }; state = JSON.parse(JSON.stringify(st || {})); location.hash = 'view'; scrollTo(0, 0); home(); };
  document.getElementById('viewall').onclick = () => viewAs({ id: 'teacher', name: '전체 수업', group: '' }, Object.keys(DATA.memos), {});
  document.getElementById('viewfull').onclick = () => viewAs({ id: 'teacher', name: '전체 기능 체험', group: '' }, Object.keys(DATA.memos), {}, true);
  app.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { const r = byId[b.dataset.view]; viewAs({ id: r.id, name: r.name, group: r.group }, memosFor(r), r.state); });
  document.getElementById('aout').onclick = () => { adminTok = null; store.set('nyft:admin', null); location.hash = ''; };
  document.getElementById('add').onsubmit = async e => {
    e.preventDefault();
    const name = document.getElementById('nn').value.trim(); if (!name) return;
    const id = 's-' + Math.random().toString(36).slice(2, 8);
    await api.adminSave(adminTok, id, name, document.getElementById('ng').value, []); admin();
  };
  app.querySelectorAll('[data-grp]').forEach(sel => sel.onchange = async () => {
    const r = byId[sel.dataset.grp];
    await api.adminSave(adminTok, r.id, r.name, sel.value, r.memos || []); admin();
  });
  document.getElementById('addgrp').onsubmit = async e => {
    e.preventDefault();
    const g = document.getElementById('gname').value.trim(); if (!g) return;
    if (groups.includes(g)) return toast('이미 있는 반이에요.');
    await api.saveGroups(adminTok, [...groups, g]); GROUPS = [...groups, g]; admin();
  };
  app.querySelectorAll('[data-rengrp]').forEach(b => b.onclick = () => {
    const g = b.dataset.rengrp, row = b.closest('.adm-grow');
    row.innerHTML = `<input class="answer-in" value="${esc(g)}" style="min-width:0;flex:1"><span class="row" style="gap:4px;flex:none"><button class="btn" style="width:auto;padding:0 14px;white-space:nowrap">저장</button><button class="ghost">취소</button></span>`;
    const inp = row.querySelector('input'), [ok, no] = row.querySelectorAll('button');
    inp.focus(); inp.select();
    no.onclick = () => admin();
    const save = async () => {
      const n = inp.value.trim(); if (!n || n === g) return admin();
      if (groups.includes(n)) return toast('이미 있는 반이에요.');
      ok.disabled = true;
      for (const r of rows.filter(r => r.group === g)) await api.adminSave(adminTok, r.id, r.name, n, r.memos || []);
      const list = groups.map(x => x === g ? n : x);
      await api.saveGroups(adminTok, list); GROUPS = list; toast('반 이름을 바꿨어요.'); admin();
    };
    ok.onclick = save; inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); save(); } if (e.key === 'Escape') admin(); };
  });
  app.querySelectorAll('[data-delgrp]').forEach(b => b.onclick = async () => {

    for (const r of inG) await api.adminSave(adminTok, r.id, r.name, '', r.memos || []);
    const left = groups.filter(x => x !== g);
    await api.saveGroups(adminTok, left); GROUPS = left; admin();
  });
  app.querySelectorAll('[data-memo]').forEach(c => c.onchange = async () => {
    const r = byId[c.dataset.memo];
    const picked = [...app.querySelectorAll(`[data-memo="${CSS.escape(r.id)}"]:checked:not(:disabled)`)].map(x => x.value);
    await api.adminSave(adminTok, r.id, r.name, r.group || '', picked); r.memos = picked;
  });
  app.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    const id = b.dataset.id, act = b.dataset.act, r = byId[id];
    if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = act === 'reset' ? '정말 초기화할까요?' : act === 'off' ? `${r.name} 정말 내보낼까요?` : '다시 들일까요?'; return; }
    if (act === 'reset') await api.adminReset(adminTok, id);
    else await api.adminActive(adminTok, id, act === 'on');
    admin();
  });
}
function demo(name) {
  const s = DATA.students.find(x => nameKey(x.name) === nameKey(name));

  grammarHub: 'grammar', grammarUnit: 'grammar', tensePage: 'grammar', weakPage: 'grammar', tenMinute: 'ten', cards: 'cards' };

const FOCUS = new Set(['cards', 'quiz', 'speak', 'wordQuiz', 'finish']);
const NO_NAV = new Set(['login', 'admin', 'changePin', 'demo']);
function layout(name) {
  const b = document.body, side = document.getElementById('side'), tb = document.getElementById('tabbar');
  const on = !!me && !NO_NAV.has(name);
  b.dataset.screen = name; b.classList.toggle('authed', on); b.classList.toggle('focus', on && FOCUS.has(name));

  tb.innerHTML = NAV.filter(n => n[3]).map(([k, ico, , short]) => `<button data-go="${k}" ${k === act ? 'aria-current="page"' : ''}><span class="i">${ico}</span>${short}${k === 'cards' && due ? `<span class="dot"></span>` : ''}</button>`).join('');

const lessonRaw = lesson;
const screen = (name, f) => function (...a) { const r = f.apply(this, a); layout(name); navSave(name, a); return r; };
// Ryan 2026-11-01: a refresh brings back the same screen (and memo page) instead of the login screen.
const NAV_OK = { home: 0, lesson: 2, dict: 0, speakPick: 0, speak: 1, wordbook: 0, grammarHub: 0, grammarUnit: 1, tensePage: 0, weakPage: 0 };
const ss = { get(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, JSON.stringify(v)); } catch {} } };
function navSave(name, a) {
  if (!me || !(name in NAV_OK)) return;
  const args = a.slice(0, NAV_OK[name]).map(x => (typeof x === 'string' || typeof x === 'number') ? x : null);
  const old = ss.get('nyft:nav');
  const same = old && old.name === name && JSON.stringify(old.args) === JSON.stringify(args);
  ss.set('nyft:nav', { name, args, page: same ? old.page : null });
}
function navRestore() {
  const n = ss.get('nyft:nav'), fns = { home, lesson, dict, speakPick, speak, wordbook, grammarHub, grammarUnit, tensePage, weakPage };
  if (!n || !fns[n.name] || (n.name === 'lesson' || n.name === 'speak') && !DATA.memos[n.args[0]]) return home();
  if (n.name === 'lesson' && n.page) RESTORE_PAGE = { id: n.args[0], ...n.page };
  try { fns[n.name](...n.args.filter(x => x != null)); } catch { home(); }
}
async function restoreView() {
  const va = ss.get('nyft:viewas'); adminTok = adminTok || store.get('nyft:admin', null);
  if (!va || !adminTok) return admin();
  let rows = null; try { rows = await api.adminList(adminTok); } catch {}
  if (!rows || !rows.length) return admin();
  if (CFG.url && !Object.keys(DATA.memos).length) { try { await loadMemos(adminTok); } catch {} }
  const r = va.sid ? rows.find(x => x.id === va.sid) : null;
  if (va.sid && !r) return admin();
  EXTRAS = !!va.full;
  me = r ? { id: r.id, name: r.name, group: r.group, memos: memosFor(r), viewOnly: true, token: null } : { id: 'teacher', name: va.name, group: '', memos: Object.keys(DATA.memos), viewOnly: true, token: null };
  state = JSON.parse(JSON.stringify((r && r.state) || {}));
  navRestore();
}
