<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RYAN's Class review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a single narrow study column (phone first); a sticky top bar holds the student's name and back button. */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --ink: #16213a;
  --muted: #5d6882;
  --line: #dde2ec;
  --accent: #1f4fd1;
  --accent-soft: #e6ecfc;
  --mark: #ffe066;
  --good: #1f8a5b;
  --good-soft: #e3f4ec;
  --bad: #c2413b;
  --bad-soft: #fbe9e8;
  --display: "Bricolage Grotesque", "IBM Plex Sans KR", system-ui, sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1422; --surface: #182035; --ink: #e8ecf6; --muted: #9aa5bf; --line: #2a3450;
  --accent: #7f9dff; --accent-soft: #23305a; --mark: #8a6d00; --good: #5fd19b; --good-soft: #163a2b; --bad: #ff8a84; --bad-soft: #43201f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1422; --surface: #182035; --ink: #e8ecf6; --muted: #9aa5bf; --line: #2a3450;
  --accent: #7f9dff; --accent-soft: #23305a; --mark: #8a6d00; --good: #5fd19b; --good-soft: #163a2b; --bad: #ff8a84; --bad-soft: #43201f; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 48px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.01em }
h2 { font-size: 1.35rem; font-weight: 700 }
h3 { font-size: 1.05rem; font-weight: 700 }
p { margin: 0 }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.label { font-family: var(--body); font-weight: 500; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted) }
.stack { display: flex; flex-direction: column; gap: 12px }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
mark { background: linear-gradient(transparent 55%, var(--mark) 55%); color: inherit; padding: 0 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.bar .who { font-weight: 700; flex: 1; min-width: 0 }
.ghost { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: .9rem; }
.ghost:hover { border-color: var(--accent); color: var(--accent) }

.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; background: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn { color: #0f1422 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #0f1422 } }
.btn.secondary { background: var(--accent-soft); color: var(--accent) }
.btn:disabled { opacity: .45; cursor: default }

/* Login */
.welcome h1 { font-size: 2.4rem; line-height: 1.15; letter-spacing: -0.02em }
.welcome .hero { padding-top: 40px }
.hero { padding-block: 28px 8px; display: grid; gap: 10px }
.hero p { color: var(--muted); max-width: 34em }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.name { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-align: left; display: grid; gap: 2px; }
.name:hover { border-color: var(--accent) }
.name strong { font-size: 1.05rem }
.name span { font-size: .8rem; color: var(--muted) }
.pin { display: flex; gap: 8px; }
.pin input { flex: 1; min-width: 0; font: 600 1.4rem var(--mono); letter-spacing: .4em; text-align: center; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.err { color: var(--bad); font-size: .9rem; min-height: 1.4em }

/* Home */
.today { background: var(--ink); color: var(--bg); border-radius: 18px; padding: 20px; display: grid; gap: 14px; }
.today .big { font-family: var(--display); font-size: 2.6rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums }
.today .btn { background: var(--mark); color: #16213a; justify-self: start }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.stat b { display: block; font-family: var(--display); font-size: 1.5rem; font-variant-numeric: tabular-nums }
.stat span { font-size: .8rem; color: var(--muted) }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.mode { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; text-align: left; display: grid; gap: 4px; }
.mode:hover { border-color: var(--accent) }
.mode span { font-size: .85rem; color: var(--muted) }
.lesson { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-align: left; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; width: 100%; }
.lesson:hover { border-color: var(--accent) }
.date { font-family: var(--mono); font-weight: 500; text-align: center; line-height: 1.1; color: var(--accent) }
.date small { display: block; font-size: .7rem; color: var(--muted) }
.lesson .t { min-width: 0 }
.lesson .t p { font-size: .85rem; color: var(--muted); overflow-wrap: anywhere }
.meter { width: 54px; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden }
.meter i { display: block; height: 100%; background: var(--good) }

/* Home v2 */
.lesson h3 { font-family: var(--body); font-size: 1rem; font-weight: 700; text-wrap: pretty; line-height: 1.4 }
.hello { display: flex; gap: 16px; align-items: center; justify-content: space-between; padding-top: 6px }
.hello h1 { font-size: 1.65rem; line-height: 1.3 }
.chip { font-size: .8rem; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted) }
.chip.hot { color: var(--bad); border-color: currentColor; background: var(--bad-soft) }
.ring { width: 92px; height: 92px; flex: none }
.ring circle { fill: none; stroke-width: 9 }
.ring-bg { stroke: var(--line) }
.ring-fg { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .6s ease }
.ring-n { font: 800 22px var(--display); fill: var(--ink); text-anchor: middle }
.ring-g { font: 500 11px var(--body); fill: var(--muted); text-anchor: middle }
.ko-src { font-size: 1.1rem; font-weight: 600; margin: 0; color: var(--ink) }
.hintbtn { justify-self: start; font-size: .9rem }
.hint { background: var(--surface-2, rgba(127,127,127,.08)); border-radius: 12px; padding: 10px 14px; font-size: .92rem; line-height: 1.6 }
.cta { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; border: 0; border-radius: 20px; padding: 20px 22px; background: var(--ink); color: var(--bg); box-shadow: 0 10px 30px -14px var(--ink); transition: transform .15s }
.cta:hover:not(:disabled) { transform: translateY(-2px) }
.cta b { display: block; font-family: var(--display); font-size: 1.25rem }
.cta small { display: block; opacity: .75; font-size: .88rem; margin-top: 2px }
.cta .arrow { width: 44px; height: 44px; flex: none; border-radius: 50%; background: var(--mark); color: #16213a; display: grid; place-items: center; font-size: 1.3rem; font-weight: 800 }
.cta:disabled { background: var(--surface); color: var(--muted); border: 1px solid var(--line); box-shadow: none; cursor: default }
.cta:disabled .arrow { background: var(--line); color: var(--muted) }
.mode .ico { font-size: 1.4rem }
.mode:disabled { opacity: .5; cursor: default }
.mode:disabled:hover { border-color: var(--line) }
.date { font-family: var(--display); font-size: 1.35rem; font-weight: 800; min-width: 2.4em }
.card { animation: rise .25s ease }
@keyframes rise { from { opacity: .4; transform: translateY(6px) } to { opacity: 1; transform: none } }

/* Lesson */
.passage { display: grid; gap: 10px; font-size: 1.12rem; line-height: 1.65 }
.passage .s { display: block }
.partbtn { display: flex; gap: 10px; align-items: center; justify-content: space-between; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 14px; font: inherit; color: var(--ink); text-align: left }
.partbtn .muted { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: .88rem }
.passage .s-ko { display: block; font-size: .9rem; color: var(--sub); line-height: 1.5; margin-top: 2px }
.passage .s-ex { display: block; font-size: .85rem; color: var(--accent); line-height: 1.5; margin-top: 2px }
.passage .s-ex b { font-weight: 700 }
.passage .s.gap { border: 1.5px dashed var(--accent); border-radius: 12px; padding: 10px 12px; background: var(--accent-soft); font-size: 1rem }
.passage .s.gap .ko { color: var(--ink); font-weight: 600 }
.passage .s.gap .hint { color: var(--accent); font-family: var(--mono); font-size: .92rem; letter-spacing: .02em }
.passage .s.open { border-style: solid; background: var(--good-soft); border-color: var(--good) }
.passage .s.open .en { font-weight: 700; display: block; margin-top: 4px }
.ladder { display: flex; gap: 4px }
.ladder i { flex: 1; height: 6px; border-radius: 3px; background: var(--line) }
.ladder i.on { background: var(--accent) }
.ladder i.now { background: var(--mark) }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px }
.tab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; white-space: nowrap; font-size: .9rem }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.expr { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; }
.expr .head { display: flex; gap: 8px; align-items: baseline; justify-content: space-between }
.expr .en { font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere }
.expr .ko { color: var(--accent); font-size: .9rem }
.expr .note { font-size: .92rem; color: var(--muted) }
.ex { font-size: .95rem; border-left: 3px solid var(--line); padding-left: 10px; display: flex; gap: 6px; align-items: flex-start }
.say { background: none; border: 0; padding: 0 4px; font-size: 1rem; line-height: 1.5; color: var(--accent) }
.memo-link { color: var(--accent); font-weight: 700; text-decoration: none }

/* Card / quiz */
.progress { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px 20px; display: grid; gap: 14px; min-height: 260px; align-content: start; }
.card .prompt { font-size: 1.3rem; font-weight: 700; line-height: 1.4 }
.card .answer { border-top: 1px dashed var(--line); padding-top: 14px; display: grid; gap: 8px }
.card .answer .en { font-family: var(--display); font-size: 1.5rem; font-weight: 800; overflow-wrap: anywhere }
.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.grade { border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; background: var(--surface); font-weight: 700; display: grid; gap: 0; }
.grade small { font-weight: 400; font-size: .75rem; color: var(--muted) }
.grade.again { color: var(--bad) } .grade.good { color: var(--good) }
.sentence { font-size: 1.15rem; line-height: 1.9 }
.blank { display: inline-block; min-width: 6em; border-bottom: 2px solid var(--accent); margin: 0 4px; color: var(--accent); font-weight: 700 }
.answer-in { width: 100%; font: 500 1.1rem var(--body); padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.answer-in.ok { border-color: var(--good); background: var(--good-soft) }
.answer-in.no { border-color: var(--bad); background: var(--bad-soft) }
.feedback { border-radius: 12px; padding: 12px 14px; font-size: .95rem }
.feedback.ok { background: var(--good-soft); color: var(--good) }
.feedback.no { background: var(--bad-soft); color: var(--bad) }
.feedback b { color: var(--ink) }
.pill { font-size: .78rem; border-radius: 999px; padding: 2px 10px; background: var(--accent-soft); color: var(--accent); font-weight: 700 }
.done { text-align: center; padding: 30px 10px; display: grid; gap: 12px; justify-items: center }
.done .big { font-family: var(--display); font-size: 3rem; font-weight: 800 }
@media (max-width: 420px) { h1 { font-size: 1.7rem } .modes { grid-template-columns: 1fr } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }

/* ===== Toss-like look (Ryan 2026-10-30): light gray canvas, white rounded cards without borders,
   one confident blue, big bold headings, large full-width buttons, grouped list rows. ===== */
:root {
  --bg: #f2f4f6; --surface: #ffffff; --ink: #191f28; --muted: #8b95a1; --sub: #4e5968; --line: #e5e8eb; --fill: #f2f4f6;
  --accent: #3182f6; --accent-soft: #e8f3ff; --mark: #cfe4ff; --good: #3182f6; --good-soft: #e8f3ff; --bad: #f04452; --bad-soft: #ffeeee;
  --display: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --body: var(--display);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101013; --surface: #1d1d22; --ink: #f2f2f4; --muted: #8d8d96; --sub: #b0b0b8; --line: #2c2c34; --fill: #2c2c34;
  --accent: #4593fc; --accent-soft: #1b2a40; --mark: #23406a; --good: #4593fc; --good-soft: #1b2a40; --bad: #f76674; --bad-soft: #3a1d22; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101013; --surface: #1d1d22; --ink: #f2f2f4; --muted: #8d8d96; --sub: #b0b0b8; --line: #2c2c34; --fill: #2c2c34;
  --accent: #4593fc; --accent-soft: #1b2a40; --mark: #23406a; --good: #4593fc; --good-soft: #1b2a40; --bad: #f76674; --bad-soft: #3a1d22; color-scheme: dark }
body { font-size: 16px; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased }
h1, h2, h3 { letter-spacing: -0.03em }
h1 { font-size: 1.65rem; font-weight: 800; line-height: 1.35 }
h2 { font-size: 1.25rem; font-weight: 800 }
.label { text-transform: none; letter-spacing: 0; font-size: .85rem; font-weight: 600; color: var(--muted) }
.muted { color: var(--muted) }
mark { background: var(--mark); border-radius: 4px; padding: 0 3px }
button { -webkit-tap-highlight-color: transparent; transition: transform .1s ease, background-color .15s ease }
button:active:not(:disabled) { transform: scale(.97) }

.bar { background: var(--bg); border-bottom: 0; margin-bottom: 12px; padding-block: 12px }
.bar .who { font-weight: 700; font-size: 1rem }
.ghost { border: 0; background: var(--surface); color: var(--sub); border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: .88rem }
.ghost:hover { color: var(--ink); border: 0 }
.pill { border-radius: 8px; font-weight: 600 }

.btn { border-radius: 16px; padding: 16px 20px; font-size: 1.05rem; font-weight: 700; background: var(--accent); color: #fff !important; min-height: 56px }
.btn.secondary { background: var(--accent-soft); color: var(--accent) !important }
.btn.secondary { background: var(--accent-soft); color: var(--accent) !important }
.answer-in { background: var(--fill); border: 2px solid transparent; border-radius: 14px; padding: 15px 16px; font-size: 1.05rem }
.answer-in:focus { outline: none; border-color: var(--accent); background: var(--surface) }
.err { color: var(--bad) }

.welcome h1 { font-size: 2.1rem; line-height: 1.25 }
.welcome mark { background: none; color: var(--accent); padding: 0 }

.hello { background: var(--surface); border-radius: 24px; padding: 24px 22px }
.hello h1 { font-size: 1.45rem; line-height: 1.4 }
.hello h1 mark { background: none; color: var(--accent); padding: 0 }
.chip { background: var(--fill); border: 0; color: var(--sub); font-weight: 600; border-radius: 8px; padding: 5px 10px }
.chip.hot { background: var(--bad-soft); color: var(--bad) }
.ring-bg { stroke: var(--fill) }
.ring-fg { stroke: var(--accent) }

.cta { background: var(--accent); color: #fff; border-radius: 24px; box-shadow: none; padding: 22px }
.cta b { font-size: 1.2rem; letter-spacing: -0.02em }
.cta small { opacity: .85 }
.cta .arrow { background: rgba(255,255,255,.22); color: #fff; width: 40px; height: 40px }
.cta:hover:not(:disabled) { transform: none }
.cta:disabled { background: var(--surface); color: var(--muted); border: 0 }
.cta:disabled .arrow { background: var(--fill); color: var(--muted) }

.modes { gap: 12px }
.mode { border: 0; border-radius: 24px; padding: 20px; gap: 6px }
.mode:hover { border: 0 }
.mode h3 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em }
.mode span:not(.ico) { color: var(--muted); font-size: .88rem; line-height: 1.45 }
.mode .ico { width: 44px; height: 44px; border-radius: 14px; background: var(--fill); display: grid; place-items: center; font-size: 1.35rem; margin-bottom: 4px }

.group { background: var(--surface); border-radius: 24px; padding: 6px 0; overflow: hidden }
.group .lesson { border: 0; border-radius: 0; background: none; padding: 14px 20px; position: relative }
.group .lesson + .lesson::before { content: ""; position: absolute; top: 0; left: 20px; right: 20px; height: 1px; background: var(--line) }
.group .lesson:hover { background: var(--fill) }
.lesson { border: 0; border-radius: 20px }
.lesson h3 { font-weight: 600; font-size: 1rem; letter-spacing: -0.02em }
.lesson .t p { color: var(--muted); font-size: .85rem }
.date { color: var(--accent); font-size: 1.25rem; font-weight: 800; min-width: 2.2em }
.date small { color: var(--muted); font-weight: 600 }
.meter { background: var(--fill); width: 48px }
.meter i { background: var(--accent) }

.tabs { gap: 4px; background: var(--fill); border-radius: 14px; padding: 4px; overflow-x: auto }
.tab { border: 0; background: none; color: var(--muted); border-radius: 10px; padding: 8px 14px; font-weight: 700; flex: 1 0 auto }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08) }
.expr { border: 0; border-radius: 20px; padding: 18px 20px }
.ex { border-left: 0; padding-left: 0; color: var(--sub) }
.memo-link { color: var(--accent) }

.progress, .ladder i { background: var(--line) }
.progress i, .ladder i.on { background: var(--accent) }
.ladder i.now { background: var(--accent); opacity: .45 }
.card { border: 0; border-radius: 24px; padding: 26px 22px }
.card .prompt { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.03em }
.card .answer { border-top: 1px solid var(--line) }
.grades { gap: 10px }
.grade { border: 0; border-radius: 16px; padding: 14px 6px; background: var(--surface); font-weight: 700; font-size: 1rem }
.grade.again { color: var(--bad); background: var(--bad-soft) }
.grade.good { color: #fff; background: var(--accent) }
.grade.good small { color: rgba(255,255,255,.8) }
.blank { border-bottom-color: var(--accent) }
.feedback { border-radius: 16px }

.passage .s.gap { border: 0; background: var(--accent-soft); border-radius: 16px; padding: 14px 16px }
.passage .s.gap .ko { color: var(--ink); font-weight: 600 }
.passage .s.open { background: var(--fill) }
.passage .s.open .en { color: var(--accent) }
.done { background: var(--surface); border-radius: 24px; padding: 36px 22px }
.reveal { display: grid; gap: 10px; cursor: pointer; user-select: none }
.rv-item { display: none }
.rv-item.shown { display: grid; animation: slidein .35s ease }
.rv { overflow: hidden; max-height: 0; opacity: 0; transform: translateX(24px); transition: max-height .35s ease, opacity .35s ease, transform .35s ease }
.rv.shown { max-height: 400px; opacity: 1; transform: none }
.rv.ko { font-weight: 600; color: var(--ink) }
.rv.en { color: var(--accent); font-weight: 700; font-size: 1.05rem; margin-top: 2px }
.rv .qn { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; background: var(--fill); color: var(--muted); font-size: .8rem; margin-right: 8px }

, "hint": "질문", "ko": "영화 볼래요, 산책할래요?"}, {"text": "I don't like to be late. I'd rather ___ early.", "alts": [["be"], ["get there"]], "hint": "be", "ko": "늦는 건 싫어요. 차라리 일찍 가는 게 나아요."}, {"text": "She'd rather ___ by herself than with a group.", "alts": [["travel"], ["work"]], "hint": "travel", "ko": "그녀는 단체보다 혼자 여행하는 걸 좋아해요."}, {"text": "I'd rather sit on the floor. (not I'd rather ___ sit)", "alts": [["to"]], "hint": "to 쓰지 않음", "ko": "저는 바닥에 앉을래요."}], "production": [{"ko": "저는 차라리 집에 있을래요.", "en": "I'd rather stay home."}, {"ko": "오늘 밤엔 안 나가는 게 좋겠어요.", "en": "I'd rather not go out tonight."}, {"ko": "버스 타는 거랑 걷는 거 중에 뭐가 좋아요?", "en": "Would you rather take the bus or walk?"}, {"ko": "저는 운전하는 것보다 지하철 타는 게 나아요.", "en": "I'd rather take the subway than drive."}, {"ko": "지금 말고 나중에 먹을래요.", "en": "I'd rather eat later, not now."}, {"ko": "저는 혼자 여행하는 게 더 좋아요.", "en": "I'd rather travel alone."}, {"ko": "그 얘기는 안 하고 싶어요.", "en": "I'd rather not talk about it."}, {"ko": "오늘은 집에서 요리하고 싶어요.", "en": "I'd prefer to cook at home today."}]}, {"n": 34, "title": "Do this! Don't do that! Let's do this!", "chapter": "명령·제안", "points": ["명령·부탁은 동사원형으로 시작: Come here. / Please be quiet. / Have a good trip! / Enjoy your meal! / Sleep well! 하지 말라고 할 때 Don't ...: Don't be late.", "같이 하자: Let's + 동사원형 (Let's go out.), 하지 말자: Let's not ... (Let's not go out. Let's stay home.)"], "fill": [{"text": "___ here and look at this.", "alts": [["Come"]], "hint": "명령", "ko": "이리 와서 이것 좀 봐요."}, {"text": "Please ___ quiet. I'm working.", "alts": [["be"]], "hint": "be", "ko": "조용히 해 주세요. 일하는 중이에요."}, {"text": "Be careful! ___ fall.", "alts": [["Don't"]], "hint": "금지", "ko": "조심해요! 넘어지지 마요."}, {"text": "___ a good trip!", "alts": [["Have"]], "hint": "인사", "ko": "여행 잘 다녀와요!"}, {"text": "___ your meal!", "alts": [["Enjoy"]], "hint": "인사", "ko": "맛있게 드세요!"}, {"text": "Good night. ___ well!", "alts": [["Sleep"]], "hint": "인사", "ko": "잘 자요. 푹 자요!"}, {"text": "It's a nice day. ___ out.", "alts": [["Let's go"]], "hint": "제안", "ko": "날씨가 좋네요. 나가요."}, {"text": "It's cold. ___ go out. Let's stay home.", "alts": [["Let's not"]], "hint": "제안, 부정", "ko": "추워요. 나가지 말고 집에 있어요."}, {"text": "Please ___ go. Stay here with me.", "alts": [["don't"]], "hint": "금지", "ko": "가지 마요. 여기 저랑 있어요."}, {"text": "Be here on time. ___ late.", "alts": [["Don't be"]], "hint": "금지", "ko": "제시간에 와요. 늦지 마요."}, {"text": "I'm hungry. ___ something to eat.", "alts": [["Let's get"], ["Let's grab"], ["Let's have"]], "hint": "제안", "ko": "배고파요. 뭐 좀 먹으러 가요."}, {"text": "\"Should we take a taxi?\" \"No, ___. Let's walk.\"", "alts": [["let's not"]], "hint": "짧은 대답", "ko": "\"택시 탈까요?\" \"아니요, 걸어가요.\""}, {"text": "___ worry. Everything will be OK.", "alts": [["Don't"]], "hint": "금지", "ko": "걱정 마요. 다 괜찮을 거예요."}, {"text": "___ your shoes off, please.", "alts": [["Take"]], "hint": "명령", "ko": "신발 벗어 주세요."}], "production": [{"ko": "들어오세요.", "en": "Come in."}, {"ko": "조심해요! 넘어지지 마세요.", "en": "Be careful! Don't fall."}, {"ko": "즐거운 여행 되세요!", "en": "Have a good trip!"}, {"ko": "맛있게 드세요!", "en": "Enjoy your meal!"}, {"ko": "우리 나가서 산책해요.", "en": "Let's go out for a walk."}, {"ko": "오늘은 외식하지 말아요. 집에서 먹어요.", "en": "Let's not eat out today. Let's eat at home."}, {"ko": "늦지 마세요.", "en": "Don't be late."}, {"ko": "불 좀 꺼 주세요.", "en": "Please turn off the light."}]}, {"n": 35, "title": "there is / there are", "chapter": "there", "points": ["무엇이 있다고 처음 말할 때 There is (단수) / There are (복수): There's a big tree in the yard. / There are seven days in a week. 질문 Is there ...? / Are there ...? 부정 There isn't / aren't.", "there is와 it is는 달라요: There's a book on the table. I like it. It's interesting. (It = 그 책)"], "fill": [{"text": "___ a bank near here?", "alts": [["Is there"]], "hint": "질문, 단수", "ko": "이 근처에 은행 있어요?"}, {"text": "___ any good restaurants around here?", "alts": [["Are there"]], "hint": "질문, 복수", "ko": "이 근처에 괜찮은 식당 있어요?"}, {"text": "___ seven days in a week.", "alts": [["There are"]], "hint": "복수", "ko": "일주일은 7일이에요."}, {"text": "___ a man on the roof.", "alts": [["There's"], ["There is"]], "hint": "단수", "ko": "지붕 위에 남자가 있어요."}, {"text": "We can't go skiing. ___ any snow.", "alts": [["There isn't"], ["There is not"], ["There's not"]], "hint": "부정, 단수", "ko": "스키 타러 못 가요. 눈이 하나도 없어요."}, {"text": "This place is quiet. ___ many people here.", "alts": [["There aren't"], ["There are not"]], "hint": "부정, 복수", "ko": "여기는 조용해요. 사람이 별로 없어요."}, {"text": "How many players ___ on a soccer team?", "alts": [["are there"]], "hint": "질문", "ko": "축구팀은 선수가 몇 명이에요?"}, {"text": "___ a train at 10:30. ___ a fast train.", "alts": [["There's", "It's"], ["There is", "It is"]], "hint": "there vs it", "ko": "10시 30분에 기차가 있어요. 빠른 기차예요."}, {"text": "___ a lot of salt in this soup. I don't like it. ___ too salty.", "alts": [["There's", "It's"], ["There is", "It is"]], "hint": "there vs it", "ko": "이 국에 소금이 너무 많아요. 별로예요. 너무 짜요."}, {"text": "\"Is there a hotel near here?\" \"Yes, ___.\"", "alts": [["there is"]], "hint": "짧은 대답", "ko": "\"이 근처에 호텔 있어요?\" \"네, 있어요.\""}, {"text": "___ nothing on TV tonight.", "alts": [["There's"], ["There is"]], "hint": "단수", "ko": "오늘 밤엔 TV에서 볼 게 없어요."}, {"text": "Excuse me, ___ a restroom on this floor?", "alts": [["is there"]], "hint": "질문", "ko": "실례지만 이 층에 화장실 있어요?"}, {"text": "___ a lot of accidents on this road.", "alts": [["There are"]], "hint": "복수", "ko": "이 도로에서는 사고가 많이 나요."}], "production": [{"ko": "이 근처에 편의점 있어요?", "en": "Is there a convenience store near here?"}, {"ko": "냉장고에 우유가 없어요.", "en": "There isn't any milk in the fridge."}, {"ko": "우리 동네에는 공원이 많아요.", "en": "There are a lot of parks in my neighborhood."}, {"ko": "오늘 밤엔 TV에 볼 게 없어요.", "en": "There's nothing on TV tonight."}, {"ko": "책상 위에 책이 있어요. 재미있어요.", "en": "There's a book on the desk. It's interesting."}, {"ko": "이 건물에 엘리베이터 있어요?", "en": "Is there an elevator in this building?"}, {"ko": "문제가 하나 있어요.", "en": "There's a problem."}, {"ko": "수업에 학생이 몇 명 있어요?", "en": "How many students are there in the class?"}]}, {"n": 36, "title": "there was/were, there has/have been, there will be", "chapter": "there", "points": ["과거 There was / There were (There was nothing on TV last night. / Were there any problems?).", "현재완료 There has been / There have been (Look! There's been an accident. / There have been a lot of accidents on this road.), 미래 There will be (There will be rain tomorrow)."], "fill": [{"text": "___ nothing on TV last night.", "alts": [["There was"]], "hint": "과거, 단수", "ko": "어젯밤엔 TV에 볼 게 없었어요."}, {"text": "The hotel was huge. ___ 1,250 rooms.", "alts": [["There were"]], "hint": "과거, 복수", "ko": "호텔이 엄청 컸어요. 방이 1,250개였어요."}, {"text": "Was everything OK yesterday? ___ any problems?", "alts": [["Were there"]], "hint": "과거 질문", "ko": "어제는 다 괜찮았어요? 문제 없었어요?"}, {"text": "I was hungry, but ___ anything to eat.", "alts": [["there wasn't"], ["there was not"]], "hint": "과거 부정", "ko": "배가 고팠는데 먹을 게 하나도 없었어요."}, {"text": "Look! ___ an accident.", "alts": [["There's been"], ["There has been"]], "hint": "현재완료", "ko": "봐요! 사고가 났어요."}, {"text": "This road is dangerous. ___ a lot of accidents.", "alts": [["There have been"]], "hint": "현재완료", "ko": "이 길은 위험해요. 사고가 많이 났어요."}, {"text": "___ an accident last night.", "alts": [["There was"]], "hint": "과거 (어젯밤)", "ko": "어젯밤에 사고가 났어요."}, {"text": "Do you think ___ a lot of people at the party?", "alts": [["there will be"]], "hint": "미래", "ko": "파티에 사람이 많이 올 것 같아요?"}, {"text": "___ rain tomorrow afternoon.", "alts": [["There will be"], ["There'll be"]], "hint": "미래", "ko": "내일 오후에 비가 올 거예요."}, {"text": "___ a lot of people at the concert last week?", "alts": [["Were there"]], "hint": "과거 질문", "ko": "지난주 콘서트에 사람 많았어요?"}, {"text": "The boss is leaving, so ___ a new boss soon.", "alts": [["there will be"], ["there'll be"]], "hint": "미래", "ko": "사장님이 그만두셔서 곧 새 사장님이 올 거예요."}, {"text": "___ a lot of changes in our town since I was a kid.", "alts": [["There have been"]], "hint": "현재완료", "ko": "제가 어렸을 때부터 우리 동네는 많이 변했어요."}, {"text": "When I got to the station, ___ any taxis.", "alts": [["there weren't"], ["there were not"]], "hint": "과거 부정", "ko": "역에 도착했을 때 택시가 한 대도 없었어요."}], "production": [{"ko": "어젯밤에 큰 사고가 있었어요.", "en": "There was a big accident last night."}, {"ko": "파티에 사람이 많았어요.", "en": "There were a lot of people at the party."}, {"ko": "무슨 문제 있었어요?", "en": "Were there any problems?"}, {"ko": "집에 먹을 게 하나도 없었어요.", "en": "There wasn't anything to eat at home."}, {"ko": "요즘 이 동네에 변화가 많았어요.", "en": "There have been a lot of changes in this neighborhood."}, {"ko": "내일 비가 올 거예요.", "en": "There will be rain tomorrow."}, {"ko": "내일 회의에 사람이 많을 것 같아요?", "en": "Do you think there will be a lot of people at the meeting tomorrow?"}, {"ko": "방금 사고가 났어요!", "en": "There's been an accident!"}]}, {"n": 37, "title": "it ...", "chapter": "it", "points": ["시간·날짜·거리·날씨에는 it을 써요: It's 10:30. / It's Thursday. / It's two miles from here. / It's raining. far는 질문·부정에 (Is it far? It isn't far), 긍정은 a long way.", "It's + 형용사 + to ...: It's nice to see you. / It wasn't easy to find your house. it을 빼면 안 돼요 (Is raining X → It's raining)."], "fill": [{"text": "What time is ___?", "alts": [["it"]], "hint": "시간", "ko": "몇 시예요?"}, {"text": "___ late. Let's go home.", "alts": [["It's"], ["It is"]], "hint": "시간", "ko": "늦었어요. 집에 가요."}, {"text": "___ raining again.", "alts": [["It's"], ["It is"]], "hint": "날씨", "ko": "또 비가 와요."}, {"text": "___ my birthday yesterday.", "alts": [["It was"]], "hint": "날", "ko": "어제가 제 생일이었어요."}, {"text": "How far ___ from here to the airport?", "alts": [["is it"]], "hint": "거리", "ko": "여기서 공항까지 얼마나 멀어요?"}, {"text": "We can walk. It isn't ___.", "alts": [["far"]], "hint": "거리, 부정", "ko": "걸어가도 돼요. 안 멀어요."}, {"text": "It's ___ from here to the beach. Let's take a taxi.", "alts": [["a long way"]], "hint": "거리, 긍정", "ko": "여기서 해변까지 멀어요. 택시 타요."}, {"text": "___ nice to see you again.", "alts": [["It's"], ["It is"]], "hint": "It's + 형용사 + to", "ko": "다시 만나서 반가워요."}, {"text": "___ easy to find your house. You gave good directions.", "alts": [["It was"]], "hint": "It + 형용사 + to", "ko": "집 찾기 쉬웠어요. 길을 잘 알려 줬어요."}, {"text": "___ true that you're moving?", "alts": [["Is it"]], "hint": "질문", "ko": "이사 간다는 게 사실이에요?"}, {"text": "___ very windy yesterday.", "alts": [["It was"]], "hint": "날씨", "ko": "어제 바람이 엄청 불었어요."}, {"text": "___ a strong wind yesterday.", "alts": [["There was"]], "hint": "there vs it", "ko": "어제 바람이 세게 불었어요."}, {"text": "___ dangerous to swim here.", "alts": [["It's"], ["It is"]], "hint": "It's + 형용사 + to", "ko": "여기서 수영하는 건 위험해요."}, {"text": "Does ___ snow a lot in Seoul?", "alts": [["it"]], "hint": "날씨", "ko": "서울은 눈이 많이 와요?"}], "production": [{"ko": "지금 몇 시예요?", "en": "What time is it?"}, {"ko": "오늘은 정말 더워요.", "en": "It's really hot today."}, {"ko": "여기서 역까지 멀어요?", "en": "Is it far from here to the station?"}, {"ko": "다시 만나서 반가워요.", "en": "It's nice to see you again."}, {"ko": "그 사람 말은 알아듣기 힘들어요.", "en": "It's hard to understand him."}, {"ko": "공항까지는 꽤 멀어요.", "en": "It's a long way to the airport."}, {"ko": "어제는 하루 종일 비가 왔어요.", "en": "It rained all day yesterday."}, {"ko": "혼자 밤에 걷는 건 위험해요.", "en": "It's dangerous to walk alone at night."}]}, {"n": 38, "title": "I am, I don't, etc.", "chapter": "짧게 대답하기", "points": ["같은 말을 반복하지 않고 조동사로만 말해요: She isn't tired, but he is. / He likes tea, but she doesn't. / I haven't seen it, but my sister has.", "끝에 오면 줄임말 불가 (but he's X → but he is). 부정 줄임말은 OK: I am, but Megan isn't. / Yes, I am. / No, I'm not."], "fill": [{"text": "She isn't tired, but he ___.", "alts": [["is"]], "hint": "be", "ko": "그녀는 안 피곤한데 그는 피곤해요."}, {"text": "He likes coffee, but she ___.", "alts": [["doesn't"], ["does not"]], "hint": "일반동사, 부정", "ko": "그는 커피를 좋아하는데 그녀는 안 좋아해요."}, {"text": "I haven't seen the movie, but my sister ___.", "alts": [["has"]], "hint": "현재완료", "ko": "저는 그 영화 안 봤는데 여동생은 봤어요."}, {"text": "\"Please help me.\" \"I'm sorry. I ___.\"", "alts": [["can't"], ["cannot"]], "hint": "can, 부정", "ko": "\"도와주세요.\" \"미안해요. 못 도와줘요.\""}, {"text": "\"Are you tired?\" \"I ___, but I'm not now.\"", "alts": [["was"]], "hint": "과거", "ko": "\"피곤해요?\" \"아까는 그랬는데 지금은 괜찮아요.\""}, {"text": "\"Do you think she'll come?\" \"She ___.\"", "alts": [["might"]], "hint": "조동사", "ko": "\"그녀가 올 것 같아요?\" \"올 수도 있어요.\""}, {"text": "\"Are you going to study tonight?\" \"I ___, but I probably won't.\"", "alts": [["should"]], "hint": "조동사", "ko": "\"오늘 밤에 공부할 거예요?\" \"해야 하는데 아마 안 할 것 같아요.\""}, {"text": "I don't eat meat, but my husband ___.", "alts": [["does"]], "hint": "일반동사", "ko": "저는 고기를 안 먹는데 남편은 먹어요."}, {"text": "I went to bed early, but my brother ___.", "alts": [["didn't"], ["did not"]], "hint": "과거, 부정", "ko": "저는 일찍 잤는데 남동생은 안 잤어요."}, {"text": "\"Are you working tomorrow?\" \"I am, but Megan ___.\"", "alts": [["isn't"], ["is not"]], "hint": "부정", "ko": "\"내일 일해요?\" \"저는 하는데 메건은 안 해요.\""}, {"text": "\"Will Bill be here tomorrow?\" \"No, he ___.\"", "alts": [["won't"], ["will not"]], "hint": "짧은 대답", "ko": "\"빌 내일 와요?\" \"아니요, 안 와요.\""}, {"text": "\"Do you like spicy food?\" \"Yes, I ___.\"", "alts": [["do"]], "hint": "짧은 대답", "ko": "\"매운 음식 좋아해요?\" \"네, 좋아해요.\""}, {"text": "\"Have you been to Japan?\" \"No, I ___.\"", "alts": [["haven't"], ["have not"]], "hint": "짧은 대답", "ko": "\"일본 가 봤어요?\" \"아니요, 안 가 봤어요.\""}, {"text": "\"Is there a bus to the airport?\" \"Yes, there ___.\"", "alts": [["is"]], "hint": "짧은 대답", "ko": "\"공항 가는 버스 있어요?\" \"네, 있어요.\""}], "production": [{"ko": "저는 피곤하지 않은데 남편은 피곤해요.", "en": "I'm not tired, but my husband is."}, {"ko": "저는 커피를 좋아하는데 언니는 안 좋아해요.", "en": "I like coffee, but my sister doesn't."}, {"ko": "저는 그 영화 안 봤는데 친구는 봤어요.", "en": "I haven't seen the movie, but my friend has."}, {"ko": "\"운전할 수 있어요?\" \"네, 할 수 있어요.\"", "en": "\"Can you drive?\" \"Yes, I can.\""}, {"ko": "\"결혼했어요?\" \"아니요, 안 했어요.\"", "en": "\"Are you married?\" \"No, I'm not.\""}, {"ko": "공부해야 하는데 아마 안 할 거예요.", "en": "I should study, but I probably won't."}, {"ko": "\"그 사람 올까요?\" \"올 수도 있어요.\"", "en": "\"Will he come?\" \"He might.\""}, {"ko": "저는 일찍 일어났는데 아이들은 안 일어났어요.", "en": "I got up early, but the kids didn't."}]}, {"n": 39, "title": "You have? / Have you? / You are? / Are you? etc.", "chapter": "되묻기·부가의문문", "points": ["관심·놀람을 표현할 때 짧게 되물어요: \"I'm late.\" \"You are?\" / \"I speak four languages.\" \"You do?\" / \"She got married.\" \"She did?\"", "부가의문문(tag question): 긍정문 → 부정 꼬리 (It's a nice day, isn't it?), 부정문 → 긍정 꼬리 (That isn't your car, is it?)."], "fill": [{"text": "\"I was sick last week.\" \"You ___? I didn't know that.\"", "alts": [["were"]], "hint": "되묻기", "ko": "\"지난주에 아팠어요.\" \"그랬어요? 몰랐어요.\""}, {"text": "\"I speak four languages.\" \"You ___? Which ones?\"", "alts": [["do"]], "hint": "되묻기", "ko": "\"저 4개 국어 해요.\" \"그래요? 뭐뭐요?\""}, {"text": "\"Tim doesn't eat meat.\" \"He ___? Does he eat fish?\"", "alts": [["doesn't"]], "hint": "되묻기", "ko": "\"팀은 고기를 안 먹어요.\" \"그래요? 생선은 먹어요?\""}, {"text": "\"Nicole got married last week!\" \"She ___? Really?\"", "alts": [["did"]], "hint": "되묻기", "ko": "\"니콜이 지난주에 결혼했어요!\" \"그래요? 정말요?\""}, {"text": "\"Bill can't drive.\" \"He ___? I didn't know that.\"", "alts": [["can't"]], "hint": "되묻기", "ko": "\"빌은 운전을 못 해요.\" \"그래요? 몰랐어요.\""}, {"text": "It's a nice day, ___?", "alts": [["isn't it"]], "hint": "부가의문문", "ko": "날씨 좋죠?"}, {"text": "Anna lives in Portland, ___?", "alts": [["doesn't she"]], "hint": "부가의문문", "ko": "애나는 포틀랜드에 살죠?"}, {"text": "You closed the window, ___?", "alts": [["didn't you"]], "hint": "부가의문문", "ko": "창문 닫았죠?"}, {"text": "Tom will be here soon, ___?", "alts": [["won't he"]], "hint": "부가의문문", "ko": "톰 곧 오죠?"}, {"text": "That isn't your car, ___?", "alts": [["is it"]], "hint": "부가의문문", "ko": "저거 당신 차 아니죠?"}, {"text": "You haven't seen my keys, ___?", "alts": [["have you"]], "hint": "부가의문문", "ko": "제 열쇠 못 봤죠?"}, {"text": "Those shoes are nice, ___?", "alts": [["aren't they"]], "hint": "부가의문문", "ko": "그 신발 예쁘죠?"}, {"text": "You don't like spicy food, ___?", "alts": [["do you"]], "hint": "부가의문문", "ko": "매운 음식 안 좋아하죠?"}, {"text": "\"There's a problem with the car.\" \"There ___? What's wrong?\"", "alts": [["is"]], "hint": "되묻기", "ko": "\"차에 문제가 있어요.\" \"그래요? 뭐가 문제예요?\""}], "production": [{"ko": "\"저 다음 달에 이사해요.\" \"그래요? 어디로요?\"", "en": "\"I'm moving next month.\" \"You are? Where to?\""}, {"ko": "\"저 어제 그 사람 만났어요.\" \"그래요? 어땠어요?\"", "en": "\"I met him yesterday.\" \"You did? How was it?\""}, {"ko": "오늘 날씨 좋네요, 그렇죠?", "en": "It's a nice day, isn't it?"}, {"ko": "당신 커피 안 좋아하죠, 그렇죠?", "en": "You don't like coffee, do you?"}, {"ko": "문 잠갔죠, 그렇죠?", "en": "You locked the door, didn't you?"}, {"ko": "그녀는 내일 올 거죠, 그렇죠?", "en": "She'll come tomorrow, won't she?"}, {"ko": "\"저 고기 안 먹어요.\" \"그래요? 생선은요?\"", "en": "\"I don't eat meat.\" \"You don't? What about fish?\""}, {"ko": "그거 당신 거 아니죠, 그렇죠?", "en": "That isn't yours, is it?"}]}, {"n": 40, "title": "too/either, so am I / neither do I, etc.", "chapter": "맞장구", "points": ["나도: 긍정 뒤에는 too (I'm happy. - I'm happy, too.), 부정 뒤에는 either (I can't cook. - I can't, either).", "So am I = I am, too / Neither am I = I'm not, either. So/Neither + 조동사(am/do/did/have/can/will) + 주어: \"I work in a bank.\" \"So do I.\" / \"I never go there.\" \"Neither do I.\""], "fill": [{"text": "\"I'm hungry.\" \"I'm hungry, ___.\"", "alts": [["too"]], "hint": "too", "ko": "\"배고파요.\" \"저도 배고파요.\""}, {"text": "\"I can't swim.\" \"I can't, ___.\"", "alts": [["either"]], "hint": "either", "ko": "\"저 수영 못 해요.\" \"저도 못 해요.\""}, {"text": "\"I liked the movie.\" \"I liked it, ___.\"", "alts": [["too"]], "hint": "too", "ko": "\"영화 좋았어요.\" \"저도 좋았어요.\""}, {"text": "Bill doesn't watch TV. He doesn't read newspapers, ___.", "alts": [["either"]], "hint": "either", "ko": "빌은 TV를 안 봐요. 신문도 안 읽어요."}, {"text": "\"I'm working.\" \"So ___ I.\"", "alts": [["am"]], "hint": "so", "ko": "\"저 일하는 중이에요.\" \"저도요.\""}, {"text": "\"I work in a bank.\" \"So ___ I.\"", "alts": [["do"]], "hint": "so, 일반동사", "ko": "\"저 은행에서 일해요.\" \"저도요.\""}, {"text": "\"I was late today.\" \"So ___ Sam.\"", "alts": [["was"]], "hint": "so, 과거", "ko": "\"오늘 늦었어요.\" \"샘도 늦었어요.\""}, {"text": "\"I haven't been to China.\" \"Neither ___ I.\"", "alts": [["have"]], "hint": "neither", "ko": "\"저 중국 안 가 봤어요.\" \"저도 안 가 봤어요.\""}, {"text": "\"Kate can't cook.\" \"Neither ___ Tom.\"", "alts": [["can"]], "hint": "neither", "ko": "\"케이트는 요리를 못 해요.\" \"톰도 못 해요.\""}, {"text": "\"I never go to the movies.\" \"Neither ___ I.\"", "alts": [["do"]], "hint": "neither, never", "ko": "\"저는 영화관에 절대 안 가요.\" \"저도요.\""}, {"text": "\"We went to the beach last weekend.\" \"You did? So ___ we.\"", "alts": [["did"]], "hint": "so, 과거", "ko": "\"우리 지난 주말에 바다 갔어요.\" \"그래요? 우리도 갔어요.\""}, {"text": "\"I won't be here tomorrow.\" \"Neither ___ I.\"", "alts": [["will"]], "hint": "neither", "ko": "\"저 내일 여기 없을 거예요.\" \"저도요.\""}, {"text": "\"I'd like to go to Australia.\" \"So ___ I.\"", "alts": [["would"]], "hint": "so", "ko": "\"호주에 가 보고 싶어요.\" \"저도요.\""}, {"text": "\"I didn't sleep well.\" \"___ did I.\"", "alts": [["Neither"]], "hint": "neither", "ko": "\"잠을 잘 못 잤어요.\" \"저도요.\""}], "production": [{"ko": "\"저 배고파요.\" \"저도요.\"", "en": "\"I'm hungry.\" \"So am I.\""}, {"ko": "\"저 매운 음식 못 먹어요.\" \"저도요.\"", "en": "\"I can't eat spicy food.\" \"Neither can I.\""}, {"ko": "\"저는 어제 늦게 잤어요.\" \"저도요.\"", "en": "\"I went to bed late last night.\" \"So did I.\""}, {"ko": "\"저는 커피 안 마셔요.\" \"저도 안 마셔요.\"", "en": "\"I don't drink coffee.\" \"Neither do I.\""}, {"ko": "그녀는 의사예요. 남편도 의사예요.", "en": "She's a doctor. Her husband is a doctor, too."}, {"ko": "저도 그 영화 안 봤어요.", "en": "I haven't seen the movie, either."}, {"ko": "\"저 제주도 가 봤어요.\" \"저도요.\"", "en": "\"I've been to Jeju.\" \"So have I.\""}, {"ko": "\"저는 내일 안 와요.\" \"저도요.\"", "en": "\"I won't be here tomorrow.\" \"Neither will I.\""}]}, {"n": 41, "title": "isn't, haven't, don't, etc. (negatives)", "chapter": "부정문", "points": ["조동사(am/is/are/was/have/will/can/should 등) 뒤에 not: isn't, wasn't, haven't, won't, can't, couldn't, shouldn't, must not.", "일반동사는 don't / doesn't / didn't + 동사원형: Liz doesn't play the guitar. / I didn't get up early. (didn't got X)"], "fill": [{"text": "I'm ___ tired.", "alts": [["not"]], "hint": "be", "ko": "저 안 피곤해요."}, {"text": "It ___ raining now.", "alts": [["isn't"], ["is not"], ["'s not"]], "hint": "be, 부정", "ko": "지금 비 안 와요."}, {"text": "The stores ___ open yesterday.", "alts": [["weren't"], ["were not"]], "hint": "과거, 부정", "ko": "어제 가게들이 문을 안 열었어요."}, {"text": "I ___ finished my work yet.", "alts": [["haven't"], ["have not"]], "hint": "현재완료, 부정", "ko": "아직 일을 다 못 끝냈어요."}, {"text": "We ___ be here tomorrow.", "alts": [["won't"], ["will not"]], "hint": "미래, 부정", "ko": "우리 내일 여기 없을 거예요."}, {"text": "John ___ drive.", "alts": [["can't"], ["cannot"]], "hint": "can, 부정", "ko": "존은 운전을 못 해요."}, {"text": "You ___ work so hard.", "alts": [["shouldn't"], ["should not"]], "hint": "조언, 부정", "ko": "그렇게 열심히 일하지 마요."}, {"text": "I ___ want to go out tonight.", "alts": [["don't"], ["do not"]], "hint": "일반동사, 부정", "ko": "오늘 밤엔 나가고 싶지 않아요."}, {"text": "My dad ___ like his job.", "alts": [["doesn't"], ["does not"]], "hint": "3인칭, 부정", "ko": "아빠는 일을 안 좋아하세요."}, {"text": "I ___ get up early this morning.", "alts": [["didn't"], ["did not"]], "hint": "과거, 부정", "ko": "오늘 아침에 일찍 안 일어났어요."}, {"text": "She ___ to the party. She was busy.", "alts": [["didn't come"], ["did not come"], ["didn't go"], ["did not go"]], "hint": "과거, 부정", "ko": "그녀는 파티에 안 왔어요. 바빴어요."}, {"text": "I ___ sleep last night. It was too hot.", "alts": [["couldn't"], ["could not"]], "hint": "과거, 부정", "ko": "어젯밤에 잠을 못 잤어요. 너무 더웠어요."}, {"text": "They ___ a car. They take the bus everywhere.", "alts": [["don't have"], ["do not have"]], "hint": "have, 부정", "ko": "그들은 차가 없어요. 어디든 버스를 타요."}, {"text": "He ___ been to Mexico.", "alts": [["hasn't"], ["has not"]], "hint": "현재완료, 부정", "ko": "그는 멕시코에 안 가 봤어요."}], "production": [{"ko": "저는 오늘 안 피곤해요.", "en": "I'm not tired today."}, {"ko": "그 가게는 일요일에 문을 안 열어요.", "en": "That store doesn't open on Sundays."}, {"ko": "아직 저녁 안 먹었어요.", "en": "I haven't had dinner yet."}, {"ko": "어제 밤에 잠을 못 잤어요.", "en": "I couldn't sleep last night."}, {"ko": "그는 술을 안 마셔요.", "en": "He doesn't drink."}, {"ko": "오늘 아침에 아침밥 안 먹었어요.", "en": "I didn't eat breakfast this morning."}, {"ko": "내일은 비가 안 올 거예요.", "en": "It won't rain tomorrow."}, {"ko": "너무 늦게까지 일하지 않는 게 좋아요.", "en": "You shouldn't work too late."}]}, {"n": 42, "title": "is it ...? have you ...? do they ...? etc. (questions 1)", "chapter": "의문문", "points": ["질문은 첫 번째 동사(is/are/was/have/will/can 등)가 주어 앞으로: Has the movie started? (Has started the movie? X) / When was the telephone invented?", "일반동사는 do/does/did + 주어 + 동사원형: Does Chris have a car? / What time did she get up? / What do you do? (do가 본동사일 때도)"], "fill": [{"text": "___ you eating?", "alts": [["Are"]], "hint": "be", "ko": "먹고 있어요?"}, {"text": "Where ___ Max from?", "alts": [["is"]], "hint": "be", "ko": "맥스는 어디 출신이에요?"}, {"text": "___ the movie started?", "alts": [["Has"]], "hint": "현재완료", "ko": "영화 시작했어요?"}, {"text": "When ___ they be here?", "alts": [["will"]], "hint": "미래", "ko": "그들은 언제 와요?"}, {"text": "___ Paula swim?", "alts": [["Can"]], "hint": "can", "ko": "폴라는 수영할 줄 알아요?"}, {"text": "___ Chris have a car?", "alts": [["Does"]], "hint": "3인칭", "ko": "크리스는 차 있어요?"}, {"text": "What time ___ she get up this morning?", "alts": [["did"]], "hint": "과거", "ko": "그녀는 오늘 아침 몇 시에 일어났어요?"}, {"text": "How often ___ you watch TV?", "alts": [["do"]], "hint": "현재", "ko": "TV 얼마나 자주 봐요?"}, {"text": "What ___ you ___ for dinner last night?", "alts": [["did", "have"], ["did", "eat"]], "hint": "과거", "ko": "어젯밤 저녁에 뭐 먹었어요?"}, {"text": "When ___ the telephone invented?", "alts": [["was"]], "hint": "수동태", "ko": "전화기는 언제 발명됐어요?"}, {"text": "Why ___ she angry yesterday?", "alts": [["was"]], "hint": "과거 be", "ko": "그녀는 어제 왜 화가 났어요?"}, {"text": "What ___ you ___ on weekends?", "alts": [["do", "do"]], "hint": "do가 본동사", "ko": "주말에 뭐 해요?"}, {"text": "___ you been to Japan?", "alts": [["Have"]], "hint": "현재완료", "ko": "일본 가 봤어요?"}, {"text": "Where ___ your parents live?", "alts": [["do"]], "hint": "현재", "ko": "부모님은 어디 사세요?"}], "production": [{"ko": "어디 출신이에요?", "en": "Where are you from?"}, {"ko": "영화 시작했어요?", "en": "Has the movie started?"}, {"ko": "차 있어요?", "en": "Do you have a car?"}, {"ko": "오늘 아침 몇 시에 일어났어요?", "en": "What time did you get up this morning?"}, {"ko": "주말에 보통 뭐 해요?", "en": "What do you usually do on weekends?"}, {"ko": "그 사람들 언제 와요?", "en": "When will they be here?"}, {"ko": "얼마나 자주 운동해요?", "en": "How often do you work out?"}, {"ko": "어제 왜 늦었어요?", "en": "Why were you late yesterday?"}]}, {"n": 43, "title": "Who saw you? Who did you see? (questions 2)", "chapter": "의문문", "points": ["who/what이 주어면 do/did 없이 바로 동사: Who lives in this house? / What happened? (What did happen? X) / Who's got my keys?", "who/what이 목적어면 do/does/did 사용: Who did you meet yesterday? / What did Kevin say? 사람은 who, 사물·생각은 what."], "fill": [{"text": "Who ___ in this house? (somebody lives here)", "alts": [["lives"]], "hint": "주어 질문", "ko": "이 집에는 누가 살아요?"}, {"text": "What ___? Why is everyone running?", "alts": [["happened"], ["'s happening"], ["is happening"]], "hint": "주어 질문", "ko": "무슨 일이에요? 왜 다들 뛰어요?"}, {"text": "Who ___ you meet at the party?", "alts": [["did"]], "hint": "목적어 질문", "ko": "파티에서 누구 만났어요?"}, {"text": "What ___ Kevin say?", "alts": [["did"]], "hint": "목적어 질문", "ko": "케빈이 뭐라고 했어요?"}, {"text": "Who ___ the game last night?", "alts": [["won"]], "hint": "주어 질문", "ko": "어젯밤 경기 누가 이겼어요?"}, {"text": "What ___ you win?", "alts": [["did"]], "hint": "목적어 질문", "ko": "뭐 탔어요?"}, {"text": "Who ___ you calling?", "alts": [["are"]], "hint": "목적어 질문", "ko": "누구한테 전화해요?"}, {"text": "Who ___ you this job? (somebody told you)", "alts": [["told"]], "hint": "주어 질문", "ko": "이 일 누가 알려 줬어요?"}, {"text": "What ___ Julia wearing at the wedding?", "alts": [["was"]], "hint": "목적어 질문", "ko": "줄리아는 결혼식에 뭐 입고 왔어요?"}, {"text": "___ is your favorite singer?", "alts": [["Who"]], "hint": "사람", "ko": "제일 좋아하는 가수가 누구예요?"}, {"text": "___ is your favorite song?", "alts": [["What"]], "hint": "사물", "ko": "제일 좋아하는 노래가 뭐예요?"}, {"text": "Who ___ oranges? - Eric does.", "alts": [["likes"]], "hint": "주어 질문", "ko": "오렌지 누가 좋아해요? - 에릭이요."}, {"text": "What ___ Eric like? - Oranges.", "alts": [["does"]], "hint": "목적어 질문", "ko": "에릭은 뭘 좋아해요? - 오렌지요."}, {"text": "Who ___ the window? It's broken.", "alts": [["broke"]], "hint": "주어 질문", "ko": "누가 창문 깼어요? 깨져 있어요."}], "production": [{"ko": "무슨 일이에요?", "en": "What happened?"}, {"ko": "누가 이 케이크 만들었어요?", "en": "Who made this cake?"}, {"ko": "어제 누구 만났어요?", "en": "Who did you meet yesterday?"}, {"ko": "그 사람이 뭐라고 했어요?", "en": "What did he say?"}, {"ko": "누가 이겼어요?", "en": "Who won?"}, {"ko": "누구한테 전화해요?", "en": "Who are you calling?"}, {"ko": "누가 당신한테 그 얘기 했어요?", "en": "Who told you that?"}, {"ko": "저녁으로 뭐 먹었어요?", "en": "What did you have for dinner?"}]}, {"n": 44, "title": "Who is she talking to? What is it like? (questions 3)", "chapter": "의문문", "points": ["Who/What/Where/Which 질문에서 전치사(to/from/with/about/of)는 보통 문장 끝으로: Where are you from? / Who is she talking to? / What do you want to talk about?", "What's it like? = 어때요? (좋아요/나빠요, 커요/작아요 등 설명을 요청). 이때 like는 '좋아하다'가 아니라 전치사: What's your new teacher like? / What was the weather like?"], "fill": [{"text": "Where are you ___?", "alts": [["from"]], "hint": "전치사 끝", "ko": "어디서 왔어요?"}, {"text": "Who is she talking ___?", "alts": [["to"]], "hint": "전치사 끝", "ko": "그녀는 누구랑 얘기하고 있어요?"}, {"text": "Jack was scared. What was he afraid ___?", "alts": [["of"]], "hint": "전치사 끝", "ko": "잭은 겁을 먹었어요. 뭘 무서워했어요?"}, {"text": "Who do these books belong ___?", "alts": [["to"]], "hint": "전치사 끝", "ko": "이 책들 누구 거예요?"}, {"text": "\"Kate is going on vacation.\" \"Who is she going ___?\"", "alts": [["with"]], "hint": "전치사 끝", "ko": "\"케이트 휴가 가요.\" \"누구랑 가요?\""}, {"text": "\"Can we talk?\" \"Sure. What do you want to talk ___?\"", "alts": [["about"]], "hint": "전치사 끝", "ko": "\"얘기 좀 할 수 있어요?\" \"그럼요. 무슨 얘기 하고 싶어요?\""}, {"text": "What are you looking ___? Did you lose something?", "alts": [["for"]], "hint": "전치사 끝", "ko": "뭐 찾고 있어요? 뭐 잃어버렸어요?"}, {"text": "\"There's a new restaurant near my house.\" \"What's it ___?\"", "alts": [["like"]], "hint": "What's it like?", "ko": "\"우리 집 근처에 새 식당이 생겼어요.\" \"어때요?\""}, {"text": "What ___ your new teacher like?", "alts": [["is"], ["'s"]], "hint": "be", "ko": "새 선생님은 어떤 분이에요?"}, {"text": "\"I met Nicole's parents.\" \"What ___ they like?\"", "alts": [["are"]], "hint": "be, 복수", "ko": "\"니콜 부모님 만났어요.\" \"어떤 분들이에요?\""}, {"text": "Did you have a good vacation? What ___ the weather like?", "alts": [["was"]], "hint": "과거", "ko": "휴가 잘 보냈어요? 날씨는 어땠어요?"}, {"text": "Who are you waiting ___?", "alts": [["for"]], "hint": "전치사 끝", "ko": "누구 기다려요?"}, {"text": "Which hotel are you staying ___?", "alts": [["at"], ["in"]], "hint": "전치사 끝", "ko": "어느 호텔에 묵어요?"}, {"text": "What's this book ___?", "alts": [["about"]], "hint": "전치사 끝", "ko": "이 책은 무슨 내용이에요?"}], "production": [{"ko": "어디 출신이에요?", "en": "Where are you from?"}, {"ko": "누구랑 얘기하고 있어요?", "en": "Who are you talking to?"}, {"ko": "뭘 찾고 있어요?", "en": "What are you looking for?"}, {"ko": "새 집은 어때요?", "en": "What's your new place like?"}, {"ko": "새 상사는 어떤 사람이에요?", "en": "What's your new boss like?"}, {"ko": "여행 가서 날씨는 어땠어요?", "en": "What was the weather like on your trip?"}, {"ko": "이 영화는 무슨 내용이에요?", "en": "What's this movie about?"}, {"ko": "누구 기다려요?", "en": "Who are you waiting for?"}]}, {"n": 45, "title": "What ...? Which ...? How ...? (questions 4)", "chapter": "의문문", "points": ["What + 명사: What color / What size / What kind of ...? Which = 몇 개 중에서 고를 때 (Which way should we go? / Which is yours?). What은 더 일반적 (What's the capital of Peru?). 사람은 which 대신 who: Who is taller?", "How + 형용사/부사: How tall / How old / How far / How long / How often / How much / How many / How big ...?"], "fill": [{"text": "___ color is your car?", "alts": [["What"]], "hint": "What + 명사", "ko": "차가 무슨 색이에요?"}, {"text": "___ kind of music do you like?", "alts": [["What"]], "hint": "What + 명사", "ko": "어떤 음악 좋아해요?"}, {"text": "We can go this way or that way. ___ way should we go?", "alts": [["Which"]], "hint": "고르기", "ko": "이쪽으로 가도 되고 저쪽으로 가도 돼요. 어느 쪽으로 갈까요?"}, {"text": "There are four umbrellas here. ___ is yours?", "alts": [["Which"]], "hint": "고르기", "ko": "여기 우산이 네 개 있어요. 어느 게 당신 거예요?"}, {"text": "___ is taller, Joe or David?", "alts": [["Who"]], "hint": "사람", "ko": "조랑 데이비드 중에 누가 더 커요?"}, {"text": "___ is the capital of Canada?", "alts": [["What"]], "hint": "일반 질문", "ko": "캐나다의 수도는 어디예요?"}, {"text": "___ train did you catch, the 9:50 or the 10:30?", "alts": [["Which"]], "hint": "고르기", "ko": "9시 50분 기차랑 10시 30분 기차 중에 어느 걸 탔어요?"}, {"text": "How ___ are you? - 180 centimeters.", "alts": [["tall"]], "hint": "키", "ko": "키가 몇이에요? - 180센티요."}, {"text": "How ___ is it to the station? - About a kilometer.", "alts": [["far"]], "hint": "거리", "ko": "역까지 얼마나 멀어요? - 1킬로쯤이요."}, {"text": "How ___ do you go to the gym? - Three times a week.", "alts": [["often"]], "hint": "빈도", "ko": "헬스장 얼마나 자주 가요? - 일주일에 세 번이요."}, {"text": "How ___ is this jacket? - 50 dollars.", "alts": [["much"]], "hint": "가격", "ko": "이 재킷 얼마예요? - 50달러요."}, {"text": "How ___ is your son? - He's seven.", "alts": [["old"]], "hint": "나이", "ko": "아들이 몇 살이에요? - 일곱 살이에요."}, {"text": "How ___ people came to the party?", "alts": [["many"]], "hint": "수", "ko": "파티에 몇 명 왔어요?"}, {"text": "___ size is this shirt?", "alts": [["What"]], "hint": "What + 명사", "ko": "이 셔츠 사이즈가 뭐예요?"}, {"text": "How ___ have you lived here? - Five years.", "alts": [["long"]], "hint": "기간", "ko": "여기 산 지 얼마나 됐어요? - 5년이요."}], "production": [{"ko": "무슨 음식 좋아해요?", "en": "What kind of food do you like?"}, {"ko": "어느 게 당신 거예요?", "en": "Which one is yours?"}, {"ko": "키가 몇이에요?", "en": "How tall are you?"}, {"ko": "여기서 공항까지 얼마나 멀어요?", "en": "How far is it from here to the airport?"}, {"ko": "얼마나 자주 엄마한테 전화해요?", "en": "How often do you call your mom?"}, {"ko": "이거 얼마예요?", "en": "How much is this?"}, {"ko": "신발 사이즈가 몇이에요?", "en": "What size shoes do you wear?"}, {"ko": "빨간색이랑 파란색 중에 어느 색이 좋아요?", "en": "Which color do you like, red or blue?"}]}, {"n": 46, "title": "How long does it take ...?", "chapter": "의문문", "points": ["How long does it take to + 동사 ...? = ~하는 데 얼마나 걸려요? It takes an hour to get there. / It doesn't take long to make an omelet. / It took a long time.", "사람을 넣을 때 It takes + 사람 + 시간 + to ...: It takes Tom 20 minutes to get to work. / How long did it take you to find a job?"], "fill": [{"text": "How long ___ it ___ to get from here to the airport?", "alts": [["does", "take"]], "hint": "현재", "ko": "여기서 공항까지 얼마나 걸려요?"}, {"text": "___ takes an hour to get there by bus.", "alts": [["It"]], "hint": "It takes", "ko": "거기까지 버스로 한 시간 걸려요."}, {"text": "It ___ me three days to read the book.", "alts": [["took"]], "hint": "과거", "ko": "그 책 읽는 데 3일 걸렸어요."}, {"text": "How long ___ it take you to find a job?", "alts": [["did"]], "hint": "과거", "ko": "일자리 구하는 데 얼마나 걸렸어요?"}, {"text": "It ___ long to make an omelet.", "alts": [["doesn't take"], ["does not take"]], "hint": "부정", "ko": "오믈렛 만드는 데 오래 안 걸려요."}, {"text": "It ___ long to fix the computer. Wait a minute.", "alts": [["won't take"], ["will not take"]], "hint": "미래 부정", "ko": "컴퓨터 고치는 데 오래 안 걸려요. 잠깐만 기다려요."}, {"text": "It takes a long time ___ a language.", "alts": [["to learn"]], "hint": "to + 동사", "ko": "언어를 배우는 데는 오랜 시간이 걸려요."}, {"text": "How long will it take ___ to learn to drive?", "alts": [["me"]], "hint": "사람", "ko": "운전 배우는 데 얼마나 걸릴까요?"}, {"text": "It ___ us an hour to do the shopping yesterday.", "alts": [["took"]], "hint": "과거", "ko": "어제 장 보는 데 한 시간 걸렸어요."}, {"text": "It takes Tom 20 minutes ___ to work.", "alts": [["to get"]], "hint": "to + 동사", "ko": "톰은 출근하는 데 20분 걸려요."}, {"text": "How long ___ it take to cook rice?", "alts": [["does"]], "hint": "현재", "ko": "밥 짓는 데 얼마나 걸려요?"}, {"text": "It ___ about two hours to get to Busan by KTX.", "alts": [["takes"]], "hint": "현재", "ko": "KTX로 부산까지 두 시간쯤 걸려요."}], "production": [{"ko": "집에서 회사까지 얼마나 걸려요?", "en": "How long does it take to get from your house to work?"}, {"ko": "지하철로 30분 걸려요.", "en": "It takes 30 minutes by subway."}, {"ko": "그 책 다 읽는 데 일주일 걸렸어요.", "en": "It took me a week to finish the book."}, {"ko": "오래 안 걸려요.", "en": "It won't take long."}, {"ko": "영어 배우는 데는 시간이 오래 걸려요.", "en": "It takes a long time to learn English."}, {"ko": "일자리 구하는 데 얼마나 걸렸어요?", "en": "How long did it take you to find a job?"}, {"ko": "준비하는 데 보통 한 시간 걸려요.", "en": "It usually takes me an hour to get ready."}, {"ko": "거기 가는 데 얼마나 걸릴까요?", "en": "How long will it take to get there?"}]}, {"n": 47, "title": "Do you know where ...? I don't know what ...", "chapter": "간접의문문", "points": ["질문을 문장 안에 넣으면 평서문 순서: Where is Lisa? → Do you know where Lisa is? (where is Lisa X) / Can you tell me what time it is?", "do/does/did는 빠져요: Where does he live? → Do you know where he lives? / Why did she go home? → I don't remember why she went home. Yes/No 질문은 if 또는 whether: Do you know if Jack is home?"], "fill": [{"text": "Do you know where Lisa ___?", "alts": [["is"]], "hint": "간접의문문", "ko": "리사 어디 있는지 알아요?"}, {"text": "Can you tell me what time ___?", "alts": [["it is"]], "hint": "순서", "ko": "지금 몇 시인지 알려 줄래요?"}, {"text": "I don't know how old Nicole ___.", "alts": [["is"]], "hint": "간접의문문", "ko": "니콜이 몇 살인지 몰라요."}, {"text": "Do you know where he ___? (Where does he live?)", "alts": [["lives"]], "hint": "does 빠짐", "ko": "그가 어디 사는지 알아요?"}, {"text": "I don't know what Emily ___. (What does Emily want?)", "alts": [["wants"]], "hint": "does 빠짐", "ko": "에밀리가 뭘 원하는지 모르겠어요."}, {"text": "I don't remember why she ___ home. (Why did she go home?)", "alts": [["went"]], "hint": "did 빠짐", "ko": "그녀가 왜 집에 갔는지 기억 안 나요."}, {"text": "Do you know ___ Jack is at home?", "alts": [["if"], ["whether"]], "hint": "yes/no", "ko": "잭이 집에 있는지 알아요?"}, {"text": "I don't know ___ they have a car.", "alts": [["if"], ["whether"]], "hint": "yes/no", "ko": "그들이 차가 있는지 몰라요."}, {"text": "Can you tell me how much this camera ___?", "alts": [["is"], ["costs"]], "hint": "간접의문문", "ko": "이 카메라 얼마인지 알려 줄래요?"}, {"text": "I don't know how long they ___ married.", "alts": [["have been"], ["'ve been"]], "hint": "현재완료", "ko": "그들이 결혼한 지 얼마나 됐는지 몰라요."}, {"text": "Do you know ___ Kevin can swim?", "alts": [["if"], ["whether"]], "hint": "yes/no", "ko": "케빈이 수영할 줄 아는지 알아요?"}, {"text": "I don't remember what Anna ___ wearing.", "alts": [["was"]], "hint": "과거", "ko": "애나가 뭘 입었었는지 기억 안 나요."}, {"text": "Do you know where I ___ the key?", "alts": [["put"]], "hint": "과거", "ko": "제가 열쇠를 어디 뒀는지 알아요?"}, {"text": "Do you know what time the store ___?", "alts": [["opens"], ["closes"]], "hint": "현재", "ko": "가게가 몇 시에 여는지 알아요?"}], "production": [{"ko": "화장실이 어디인지 아세요?", "en": "Do you know where the restroom is?"}, {"ko": "지금 몇 시인지 알려 주실래요?", "en": "Can you tell me what time it is?"}, {"ko": "그 사람이 어디 사는지 몰라요.", "en": "I don't know where he lives."}, {"ko": "그녀가 왜 화났는지 모르겠어요.", "en": "I don't know why she got angry."}, {"ko": "그 가게가 몇 시에 닫는지 알아요?", "en": "Do you know what time the store closes?"}, {"ko": "그 사람이 올지 안 올지 모르겠어요.", "en": "I don't know if he's coming."}, {"ko": "열쇠를 어디에 뒀는지 기억이 안 나요.", "en": "I don't remember where I put my keys."}, {"ko": "이거 얼마인지 아세요?", "en": "Do you know how much this is?"}]}, {"n": 48, "title": "She said that ... He told me that ...", "chapter": "전달하기", "points": ["들은 말을 전할 때 시제를 한 칸 과거로: am/is → was, are → were, have/has → had, can → could, will → would, do/does → did, like → liked.", "say와 tell: He said (that) he was tired. / He told me (that) he was tired. (said me X, told that X) / What did she say to you?"], "fill": [{"text": "Allison said, \"I'm enjoying my new job.\" → She said that she ___ enjoying her new job.", "alts": [["was"]], "hint": "is → was", "ko": "앨리슨이 \"새 일이 즐거워요\"라고 했어요. → 그녀는 새 일이 즐겁다고 했어요."}, {"text": "\"We're going to buy a house.\" → They said that they ___ going to buy a house.", "alts": [["were"]], "hint": "are → were", "ko": "\"우리 집 살 거예요.\" → 그들은 집을 살 거라고 했어요."}, {"text": "\"I have to leave early.\" → He said that he ___ to leave early.", "alts": [["had"]], "hint": "have → had", "ko": "\"일찍 가야 해요.\" → 그는 일찍 가야 한다고 했어요."}, {"text": "\"I can't find a job.\" → Kate said that she ___ find a job.", "alts": [["couldn't"], ["could not"]], "hint": "can → could", "ko": "\"일자리를 못 구하겠어요.\" → 케이트는 일자리를 못 구하겠다고 했어요."}, {"text": "\"I'll call you.\" → Eric said that he ___ call me.", "alts": [["would"]], "hint": "will → would", "ko": "\"전화할게요.\" → 에릭은 저한테 전화하겠다고 했어요."}, {"text": "\"I don't like my job.\" → Rachel said that she ___ like her job.", "alts": [["didn't"], ["did not"]], "hint": "do → did", "ko": "\"제 일이 싫어요.\" → 레이첼은 자기 일이 싫다고 했어요."}, {"text": "\"You look tired.\" → Mike said that I ___ tired.", "alts": [["looked"]], "hint": "look → looked", "ko": "\"피곤해 보여요.\" → 마이크가 저보고 피곤해 보인다고 했어요."}, {"text": "\"My sister has been to Australia.\" → He said that his sister ___ been to Australia.", "alts": [["had"]], "hint": "has → had", "ko": "\"제 여동생은 호주에 가 봤어요.\" → 그는 여동생이 호주에 가 봤다고 했어요."}, {"text": "He ___ that he was tired.", "alts": [["said"]], "hint": "say", "ko": "그는 피곤하다고 했어요."}, {"text": "He ___ me that he was tired.", "alts": [["told"]], "hint": "tell + 사람", "ko": "그는 저한테 피곤하다고 했어요."}, {"text": "What did she ___ to you?", "alts": [["say"]], "hint": "say to", "ko": "그녀가 뭐라고 했어요?"}, {"text": "Can you ___ me what happened?", "alts": [["tell"]], "hint": "tell + 사람", "ko": "무슨 일이 있었는지 말해 줄래요?"}, {"text": "\"I feel fine.\" → I ___ that I felt fine.", "alts": [["said"]], "hint": "say", "ko": "\"괜찮아요.\" → 저는 괜찮다고 했어요."}, {"text": "She ___ us that she was getting married.", "alts": [["told"]], "hint": "tell + 사람", "ko": "그녀는 우리한테 결혼한다고 했어요."}], "production": [{"ko": "그녀가 피곤하다고 했어요.", "en": "She said that she was tired."}, {"ko": "그가 나중에 전화하겠다고 했어요.", "en": "He said that he would call me later."}, {"ko": "그들이 저한테 이사 간다고 말했어요.", "en": "They told me that they were moving."}, {"ko": "그녀가 일자리를 못 찾겠다고 했어요.", "en": "She said that she couldn't find a job."}, {"ko": "그 사람이 뭐라고 했어요?", "en": "What did he say?"}, {"ko": "엄마가 저한테 일찍 오라고 하셨어요.", "en": "My mom told me to come home early."}, {"ko": "그는 자기 일을 안 좋아한다고 했어요.", "en": "He said that he didn't like his job."}, {"ko": "친구가 결혼한다고 저한테 말했어요.", "en": "My friend told me that she was getting married."}]}, {"n": 49, "title": "work/working, go/going, do/doing", "chapter": "동사 형태", "points": ["동사원형: will/can/might/must/should/would 뒤, do/does/did 뒤. to + 동사원형: going to, have to, want to, would like to, used to 뒤.", "-ing: am/is/are/was/were + -ing (진행형). 과거분사(worked/gone/done): have/has + 과거분사 (완료), be + 과거분사 (수동태)."], "fill": [{"text": "Anna will ___ here soon. (be)", "alts": [["be"]], "hint": "will + 원형", "ko": "애나 곧 올 거예요."}, {"text": "I might ___ you later. (call)", "alts": [["call"]], "hint": "might + 원형", "ko": "이따가 전화할 수도 있어요."}, {"text": "You shouldn't ___ so hard. (work)", "alts": [["work"]], "hint": "should + 원형", "ko": "그렇게 열심히 일하지 마요."}, {"text": "I'm going ___ tennis tomorrow. (play)", "alts": [["to play"]], "hint": "going to", "ko": "내일 테니스 칠 거예요."}, {"text": "I have ___ now. (go)", "alts": [["to go"]], "hint": "have to", "ko": "이제 가야 해요."}, {"text": "Please be quiet. I'm ___. (work)", "alts": [["working"]], "hint": "진행형", "ko": "조용히 해 주세요. 일하는 중이에요."}, {"text": "It was ___ when I got up. (rain)", "alts": [["raining"]], "hint": "과거진행", "ko": "제가 일어났을 때 비가 오고 있었어요."}, {"text": "Have you ___ your homework? (do)", "alts": [["done"], ["finished"]], "hint": "완료", "ko": "숙제 했어요?"}, {"text": "This house was ___ in 1950. (build)", "alts": [["built"]], "hint": "수동태", "ko": "이 집은 1950년에 지어졌어요."}, {"text": "How much does it ___? (cost)", "alts": [["cost"]], "hint": "does + 원형", "ko": "얼마예요?"}, {"text": "Dave used ___ in a factory. (work)", "alts": [["to work"]], "hint": "used to", "ko": "데이브는 예전에 공장에서 일했어요."}, {"text": "Would you like ___ out tonight? (go)", "alts": [["to go"]], "hint": "would like to", "ko": "오늘 밤에 나갈래요?"}, {"text": "We didn't ___ well last night. (sleep)", "alts": [["sleep"]], "hint": "didn't + 원형", "ko": "우리는 어젯밤에 잠을 잘 못 잤어요."}, {"text": "She has ___ to Japan three times. (be)", "alts": [["been"]], "hint": "완료", "ko": "그녀는 일본에 세 번 가 봤어요."}], "production": [{"ko": "저는 내일 일해야 해요.", "en": "I have to work tomorrow."}, {"ko": "그는 지금 일하고 있어요.", "en": "He's working right now."}, {"ko": "그 사람 곧 올 거예요.", "en": "He'll be here soon."}, {"ko": "숙제 다 했어요?", "en": "Have you done your homework?"}, {"ko": "이 다리는 100년 전에 지어졌어요.", "en": "This bridge was built 100 years ago."}, {"ko": "저 예전에 담배 피웠어요.", "en": "I used to smoke."}, {"ko": "오늘 밤에 나갈래요?", "en": "Do you want to go out tonight?"}, {"ko": "어젯밤에 잠을 잘 못 잤어요.", "en": "I didn't sleep well last night."}]}, {"n": 50, "title": "to ... (I want to do) and -ing (I enjoy doing)", "chapter": "to부정사·동명사", "points": ["+ to: want, plan, decide, try, forget, hope, expect, offer, need, promise, refuse, learn (decided to sell). + -ing: enjoy, stop, suggest, mind, finish (I enjoy dancing, enjoy to dance X).", "둘 다 가능: like, love, start, begin, prefer, hate, continue (It started raining / started to rain). would like / would love / would prefer + to."], "fill": [{"text": "What do you want ___ tonight? (do)", "alts": [["to do"]], "hint": "want + to", "ko": "오늘 밤에 뭐 하고 싶어요?"}, {"text": "Rachel decided ___ her car. (sell)", "alts": [["to sell"]], "hint": "decide + to", "ko": "레이첼은 차를 팔기로 했어요."}, {"text": "I enjoy ___. (dance)", "alts": [["dancing"]], "hint": "enjoy + -ing", "ko": "저는 춤추는 걸 좋아해요."}, {"text": "I don't mind ___ up early. (get)", "alts": [["getting"]], "hint": "mind + -ing", "ko": "일찍 일어나는 건 괜찮아요."}, {"text": "Did it stop ___? (rain)", "alts": [["raining"]], "hint": "stop + -ing", "ko": "비 그쳤어요?"}, {"text": "You forgot ___ off the light. (turn)", "alts": [["to turn"]], "hint": "forget + to", "ko": "불 끄는 걸 잊었네요."}, {"text": "Tara suggested ___ to the movies. (go)", "alts": [["going"]], "hint": "suggest + -ing", "ko": "타라가 영화 보러 가자고 했 이 행복했으면 좋겠어요."}, {"text": "Do you want ___ lend you some money?", "alts": [["me to"]], "hint": "want + 사람 + to", "ko": "돈 좀 빌려줄까요?"}, {"text": "Would you like ___ help you?", "alts": [["me to"]], "hint": "would like + 사람 + to", "ko": "도와드릴까요?"}, {"text": "Sue asked me ___ careful.", "alts": [["to be"]], "hint": "ask + 사람 + to", "ko": "수가 저한테 조심하라고 했어요."}, {"text": "Megan told me ___ for her.", "alts": [["to wait"]], "hint": "tell + 사람 + to", "ko": "메건이 자기를 기다리라고 했어요."}, {"text": "Nick told Sue ___ for him.", "alts": [["not to wait"]], "hint": "tell + not to", "ko": "닉은 수에게 기다리지 말라고 했어요."}, {"text": "He's so funny. He makes me ___.", "alts": [["laugh"]], "hint": "make + 원형", "ko": "그는 정말 웃겨요. 저를 웃게 해요."}, {"text": "My phone was dead, so Sue let me ___ hers.", "alts": [["use"]], "hint": "let + 원형", "ko": "제 휴대폰이 꺼져서 수가 자기 걸 쓰게 해 줬어요."}, {"text": "I'm teaching my brother ___.", "alts": [["to swim"], ["to drive"]], "hint": "teach + 사람 + to", "ko": "남동생한테 수영을 가르치고 있어요."}, {"text": "I didn't expect them ___ here.", "alts": [["to be"]], "hint": "expect + 사람 + to", "ko": "그들이 여기 올 줄 몰랐어요."}, {"text": "The teacher made us ___ really hard.", "alts": [["work"], ["study"]], "hint": "make + 원형", "ko": "선생님이 우리를 정말 열심히 공부시키셨어요."}, {"text": "What do you advise me ___?", "alts": [["to do"]], "hint": "advise + 사람 + to", "ko": "제가 뭘 하면 좋을까요?"}, {"text": "My parents didn't let me ___ out late.", "alts": [["stay"]], "hint": "let + 원형", "ko": "부모님은 제가 밤늦게까지 밖에 있는 걸 허락 안 하셨어요."}, {"text": "We persuaded Chris ___ with us.", "alts": [["to come"]], "hint": "persuade + 사람 + to", "ko": "우리는 크리스를 설득해서 같이 가게 했어요."}], "production": [{"ko": "당신이 행복했으면 좋겠어요.", "en": "I want you to be happy."}, {"ko": "제가 도와줄까요?", "en": "Do you want me to help you?"}, {"ko": "엄마가 저한테 방 청소하라고 하셨어요.", "en": "My mom told me to clean my room."}, {"ko": "그가 저한테 늦지 말라고 했어요.", "en": "He told me not to be late."}, {"ko": "그 사람은 항상 저를 웃게 해요.", "en": "He always makes me laugh."}, {"ko": "아빠가 차를 쓰게 해 주셨어요.", "en": "My dad let
